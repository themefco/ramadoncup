<header>

<script>

const ADMIN_QUERY=new URLSearchParams(location.search).get("admin")==="1";

const PUBLIC_MODE=!ADMIN_MODE;
const MATCHES_URL="local://matches"; const EVENTS_URL="local://events"; const TEAMS_URL="local://teams"; const PLAYERS_URL="local://players"; const COMPETITIONS_URL="local://competitions"; const NEWS_URL="local://news";

async function updateMatch(id,changes){let m=matches.find(x=>String(x.id)===String(id));if(!m)return false;let previous={};for(const k of Object.keys(changes))previous[k]=m[k];try{await localDataFetch(MATCHES_URL+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(changes)});Object.assign(m,changes);addLog('Updated match '+id);showToast('Match saved');renderAll();return true}catch(e){console.error(e);Object.assign(m,previous);showToast('Could not save match');return false}}
async function saveMatchReport(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let meta=matchMeta(m);meta.summary=document.getElementById('admSummary')?.value.trim()||'';meta.man_of_match=document.getElementById('admMotm')?.value||null;meta.formations={home:document.getElementById('admFormationHome')?.value||'auto',away:document.getElementById('admFormationAway')?.value||'auto'};meta.match_stats=meta.match_stats||{};['possession_home','possession_away','shots_home','shots_away','shots_on_target_home','shots_on_target_away','corners_home','corners_away','fouls_home','fouls_away','offsides_home','offsides_away','saves_home','saves_away'].forEach(k=>{let v=document.getElementById('admStat_'+k)?.value;if(v==='')delete meta.match_stats[k];else meta.match_stats[k]=Math.max(0,Number(v)||0)});meta.ratings={};document.querySelectorAll('.adm-rating-home,.adm-rating-away').forEach(i=>{if(i.value!=='')meta.ratings[i.dataset.player]=Math.max(0,Math.min(10,Number(i.value)||0))});await updateMatch(m.id,{metadata:meta})}
async function saveAdminMatch(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let home=teamById(document.getElementById('admHomeTeam').value),away=teamById(document.getElementById('admAwayTeam').value);if(!home||!away||String(home.id)===String(away.id)){showToast('Choose two different teams');return}let cs=document.getElementById('admCompetition'),changes={home_team_id:home.id,away_team_id:away.id,home:home.name,away:away.name,match_date:document.getElementById('admDate').value,match_time:document.getElementById('admTime').value,status:document.getElementById('admStatus').value,competition_id:cs.value||null,competition:cs.options[cs.selectedIndex]?.textContent||''};const optional={venue:document.getElementById('admVenue').value.trim(),city:document.getElementById('admCity').value.trim(),round:document.getElementById('admRound').value.trim(),matchday:document.getElementById('admRound').value.trim()};for(const [k,v] of Object.entries(optional)){if(Object.prototype.hasOwnProperty.call(m,k))changes[k]=v}let hflag=teamFlag(home),aflag=teamFlag(away);if(Object.prototype.hasOwnProperty.call(m,'home_flag'))changes.home_flag=hflag;if(Object.prototype.hasOwnProperty.call(m,'away_flag'))changes.away_flag=aflag;await updateMatch(m.id,changes)}
async function saveScoreOnly(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;await updateMatch(m.id,{score_home:Math.max(0,Number(document.getElementById('admHomeScore').value)||0),score_away:Math.max(0,Number(document.getElementById('admAwayScore').value)||0),minute:Math.max(0,Number(document.getElementById('admMinute').value)||0),stoppage:Math.max(0,Number(document.getElementById('admStoppage').value)||0),status:document.getElementById('admStatus')?.value||m.status})}
async function startSelected(){let ok=await updateMatch(selectedMatchId,{status:'live'});if(ok)startTimer()}
async function pauseSelected(){let ok=await updateMatch(selectedMatchId,{status:'halftime'});if(ok)stopTimer()}
async function finishSelected(){let ok=await updateMatch(selectedMatchId,{status:'finished'});if(ok)stopTimer()}
function startTimer(){stopTimer();timer=setInterval(async()=>{let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m||!isLive(m))return;let minute=Number(m.minute||0)+1;try{await localDataFetch(MATCHES_URL+'?id=eq.'+encodeURIComponent(m.id),{method:'PATCH',body:JSON.stringify({minute})});m.minute=minute;renderAdminPanel();renderTicker();if(selectedMatchId)renderMatch()}catch(e){console.warn('Clock update failed',e)}},60000)}function stopTimer(){if(timer)clearInterval(timer);timer=null}
async function postEvent(event){let result=await localDataFetch(EVENTS_URL,{method:'POST',body:JSON.stringify(event)});return Array.isArray(result)?result[0]:result}
async function adjustPlayerStat(playerId,field,delta){if(!playerId||!['goals','assists','yellow_cards','red_cards'].includes(field))return;let p=playerById(playerId);if(!p)return;let value=Math.max(0,Number(p[field]||0)+delta);try{await localDataFetch(PLAYERS_URL+'?id=eq.'+encodeURIComponent(playerId),{method:'PATCH',body:JSON.stringify({[field]:value})});p[field]=value}catch(e){console.warn('Player stat update failed',field,playerId,e)}}
async function addGoalWithAssist(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let teamId=document.getElementById('eventTeamSelect').value,playerId=document.getElementById('eventPlayerSelect').value||null,assistId=document.getElementById('eventAssistPlayerSelect').value||null,minute=Math.max(0,Number(document.getElementById('eventMinute').value)||Number(m.minute)||0),stoppage=Math.max(0,Number(document.getElementById('eventStoppage').value)||0);if(!teamId||!playerId){showToast('Select the scoring team and scorer');return}if(assistId&&String(assistId)===String(playerId)){showToast('Scorer and assister must be different');return}let p=playerById(playerId),ap=playerById(assistId),created=[];try{let goal=await postEvent({match_id:m.id,minute,stoppage,type:'goal',player_id:playerId,team_id:teamId,player:p?.name||'',team:teamName(teamId,''),detail:assistId?'Assist: '+(ap?.name||''):''});created.push(goal);m.events=m.events||[];m.events.push(goal);await adjustPlayerStat(playerId,'goals',1);if(assistId){let assist=await postEvent({match_id:m.id,minute,stoppage,type:'assist',player_id:assistId,team_id:teamId,player:ap?.name||'',team:teamName(teamId,''),detail:'For '+(p?.name||'')});created.push(assist);m.events.push(assist);await adjustPlayerStat(assistId,'assists',1)}let changes=String(teamId)===String(m.home_team_id)?{score_home:Number(m.score_home||0)+1}:{score_away:Number(m.score_away||0)+1};let ok=await updateMatch(m.id,changes);if(!ok)throw new Error('Score update failed');showToast(assistId?'Goal + assist added':'Goal added')}catch(e){console.error(e);showToast('Goal was not fully saved — check the events/player columns')}}
async function addOtherEvent(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let teamId=document.getElementById('otherEventTeam').value||null,playerId=document.getElementById('otherEventPlayer').value||null,type=document.getElementById('otherEventType').value;if(['yellow','red','substitution'].includes(type)&&!playerId){showToast('Select a player for this event');return}let p=playerById(playerId),event={match_id:m.id,minute:Math.max(0,Number(document.getElementById('otherEventMinute').value)||Number(m.minute)||0),stoppage:0,type,player_id:playerId,team_id:teamId,player:p?.name||'',team:teamName(teamId,''),detail:document.getElementById('otherEventDetail').value.trim()};try{let r=await postEvent(event);m.events=m.events||[];m.events.push(r);if(type==='yellow')await adjustPlayerStat(playerId,'yellow_cards',1);if(type==='red')await adjustPlayerStat(playerId,'red_cards',1);renderAll();showToast('Event added')}catch(e){console.error(e);showToast('Could not add event')}}
async function addAssistOnly(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let teamId=document.getElementById('eventTeamSelect').value,playerId=document.getElementById('eventAssistPlayerSelect').value||null,minute=Math.max(0,Number(document.getElementById('eventMinute').value)||Number(m.minute)||0),stoppage=Math.max(0,Number(document.getElementById('eventStoppage').value)||0);if(!teamId||!playerId){showToast('Select the team and assisting player');return}let p=playerById(playerId);try{let r=await postEvent({match_id:m.id,minute,stoppage,type:'assist',player_id:playerId,team_id:teamId,player:p?.name||'',team:teamName(teamId,''),detail:''});m.events=m.events||[];m.events.push(r);await adjustPlayerStat(playerId,'assists',1);renderAll();showToast('Assist added')}catch(e){console.error(e);showToast('Could not add assist')}}

async function addEvent(){let type=document.getElementById('eventType')?.value;if(type==='goal'){await addGoalWithAssist();return}let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let teamId=document.getElementById('eventTeamSelect').value,playerId=document.getElementById('eventPlayerSelect').value||null;if(['assist','yellow','red','substitution'].includes(type)&&!playerId){showToast('Select a player');return}let p=playerById(playerId);try{let r=await postEvent({match_id:m.id,minute:Math.max(0,Number(document.getElementById('eventMinute').value)||Number(m.minute)||0),stoppage:Math.max(0,Number(document.getElementById('eventStoppage').value)||0),type,player_id:playerId,team_id:teamId||null,player:p?.name||'',team:teamName(teamId,''),detail:''});m.events=m.events||[];m.events.push(r);renderAll();showToast('Event added')}catch(e){console.error(e);showToast('Could not add event')}}
function quickEvent(type){if(type==='assist'){document.getElementById('eventTeamSelect')?.focus();showToast('Choose the team and assisting player, then use Add selected event.');return}let s=document.getElementById('otherEventType');if(s)s.value=type;document.getElementById('otherEventPlayer')?.focus();showToast('Choose the player, then press Add event.')}
async function deleteEvent(id){if(!id){showToast('This event cannot be deleted because it has no database ID');return}let m=matches.find(x=>String(x.id)===String(selectedMatchId));let e=m?.events?.find(x=>String(x.id)===String(id));if(!e)return;try{await localDataFetch(EVENTS_URL+'?id=eq.'+encodeURIComponent(id),{method:'DELETE'});if(e.type==='goal'){await adjustPlayerStat(e.player_id,'goals',-1);let changes=String(e.team_id)===String(m.home_team_id)?{score_home:Math.max(0,Number(m.score_home||0)-1)}:String(e.team_id)===String(m.away_team_id)?{score_away:Math.max(0,Number(m.score_away||0)-1)}:null;if(changes)await updateMatch(m.id,changes)}if(e.type==='assist')await adjustPlayerStat(e.player_id,'assists',-1);if(e.type==='yellow')await adjustPlayerStat(e.player_id,'yellow_cards',-1);if(e.type==='red')await adjustPlayerStat(e.player_id,'red_cards',-1);if(m)m.events=(m.events||[]).filter(x=>String(x.id)!==String(id));renderAll();showToast('Event deleted')}catch(e2){console.error(e2);showToast('Could not delete event')}}
function lineupIdsFromEditor(side){return [...document.querySelectorAll('.'+side+'-lineup')].map(s=>s.value).filter(Boolean)}
async function saveLineups(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let home=lineupIdsFromEditor('home'),away=lineupIdsFromEditor('away'),hsub=[...document.querySelectorAll('.home-sub-lineup')].map(s=>s.value).filter(Boolean),asub=[...document.querySelectorAll('.away-sub-lineup')].map(s=>s.value).filter(Boolean);if(home.length!==new Set(home).size||away.length!==new Set(away).size||hsub.length!==new Set(hsub).size||asub.length!==new Set(asub).size){showToast('A player cannot appear twice in a lineup or bench');return}if(home.length!==11||away.length!==11){showToast('Select exactly 11 players for each starting XI');return}if(hsub.some(id=>home.includes(id))||asub.some(id=>away.includes(id))){showToast('A starting player cannot also be on the same bench');return}let meta=matchMeta(m);meta.lineups={home,away};meta.substitutes={home:hsub,away:asub};await updateMatch(m.id,{metadata:meta})}
function openMatchEditor(id){if(!ADMIN_MODE){showToast('Admin mode is required');return}selectedMatchId=id;showPage('admin');renderAdminPanel()}

function showCreateMatch(){let el=document.getElementById('adminPanel');el.innerHTML=`<div class="eyebrow">New match</div><h2>Create fixture</h2><div class="form-grid" style="margin-top:15px"><label>Competition<select id="createCompetition" class="select"><option value="">Select competition</option>${getCompetitionList().map(c=>`<option value="${esc(c.id||c.name)}" data-name="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select></label><label>Date<input id="createDate" class="input" type="date" value="${todayISO()}"></label><label>Kickoff<input id="createKickoff" class="input" type="time" value="20:00"></label><label>Home team<select id="createHomeTeam" class="select" onchange="fillCreateFlags()"><option value="">Select home team</option>${teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></label><label>Away team<select id="createAwayTeam" class="select" onchange="fillCreateFlags()"><option value="">Select away team</option>${teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></label><label>Home flag URL<input id="createHomeFlag" class="input"></label><label>Away flag URL<input id="createAwayFlag" class="input"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="createMatch()">Create Match</button></div>`}
function fillCreateFlags(){let h=teamById(document.getElementById('createHomeTeam').value),a=teamById(document.getElementById('createAwayTeam').value);if(h)document.getElementById('createHomeFlag').value=h.flag_url||h.logo_url||'';if(a)document.getElementById('createAwayFlag').value=a.flag_url||a.logo_url||''}
async function createMatch(){let cs=document.getElementById('createCompetition'),h=teamById(document.getElementById('createHomeTeam').value),a=teamById(document.getElementById('createAwayTeam').value);if(!h||!a){showToast('Select both teams');return}let c=cs.options[cs.selectedIndex],name=c?.dataset.name||c?.textContent||'';let match={competition:name,competition_id:cs.value&&!String(cs.value).startsWith('legacy-')?cs.value:null,home:h.name,away:a.name,home_team_id:h.id,away_team_id:a.id,match_date:document.getElementById('createDate').value,match_time:document.getElementById('createKickoff').value,home_flag:document.getElementById('createHomeFlag').value.trim(),away_flag:document.getElementById('createAwayFlag').value.trim(),status:'scheduled',minute:0,score_home:0,score_away:0,stoppage:0,favorite:false};try{let result=await localDataFetch(MATCHES_URL,{method:'POST',body:JSON.stringify(match)});matches.push(Array.isArray(result)?result[0]:result);showToast('Match created');renderAll()}catch(e){let fallback={...match};delete fallback.competition_id;delete fallback.home_team_id;delete fallback.away_team_id;try{let result=await localDataFetch(MATCHES_URL,{method:'POST',body:JSON.stringify(fallback)});matches.push(Array.isArray(result)?result[0]:result);showToast('Match created with legacy fields');renderAll()}catch(err){console.error(err);showToast('Could not create match')}}}
async function toggleFavorite(id){let m=matches.find(x=>String(x.id)===String(id));if(!m)return;await updateMatch(id,{favorite:!m.favorite})}
async function refreshData(){showToast('Refreshing Super Elite Cup data…');try{await loadData();showToast('Data refreshed')}catch(e){console.error(e);showToast('Data refresh failed')}}
function startAutoRefresh(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(document.visibilityState==='visible')loadData()},30000)}
async function enableNotifications(){if(!('Notification'in window)){showToast('Notifications are not supported here');return}let p=await Notification.requestPermission();document.getElementById('notificationButton').textContent=p==='granted'?'Notifications Enabled':p==='denied'?'Notifications Blocked':'Enable Notifications';showToast(p==='granted'?'Notifications enabled':'Notification permission not granted')}
async function sendNotification(title,body,url='/'){try{let r=await fetch(NOTIFICATION_API+'/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,body,url})});if(!r.ok)throw new Error(await r.text());showToast('Notification sent')}catch(e){showToast('Notification service unavailable')}}
function addLog(msg){adminLog.unshift({time:new Date().toLocaleTimeString(),msg});if(adminLog.length>50)adminLog.pop()}
window.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();navFor('search');setTimeout(()=>document.getElementById('globalSearch')?.focus(),50)}if(e.key.toLowerCase()==='r'&&e.ctrlKey){e.preventDefault();refreshData()}});
window.addEventListener('focus',()=>{if(document.visibilityState==='visible')renderTicker()});
loadData().then(()=>{
 startAutoRefresh();
 if(ADMIN_MODE)ensureAdminMatches();
}).catch(e=>{

});

<script>

function lineupIdsFromEditor(side){return [...document.querySelectorAll('.'+side+'-lineup')].map(s=>s.value).filter(Boolean)}
async function saveLineups(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let home=lineupIdsFromEditor('home'),away=lineupIdsFromEditor('away');if(home.length!==5||away.length!==5){showToast('Select exactly 5 players for each starting lineup');return}if(home.length!==new Set(home).size||away.length!==new Set(away).size){showToast('A player cannot appear twice');return}let meta=matchMeta(m);meta.lineups={home,away};await updateMatch(m.id,{metadata:meta});showToast('5v5 lineups saved')}

<script>
function renderSearch(){document.getElementById('search').innerHTML='<div class="section-head"><div><div class="eyebrow">Search</div><h2>Search the Cup</h2><p>Find teams, players, matches and competitions.</p></div></div><div class="searchbox"><input id="globalSearch" class="input" placeholder="Search Zenith, Nova, players…" oninput="runSearch(this.value)"></div><div id="searchResults" class="search-results"></div>'}
function runSearch(q){q=q.trim().toLowerCase();let el=document.getElementById('searchResults');if(!q){el.innerHTML='';return}let r=[];teams.filter(t=>(t.name+' '+(t.short_name||'')).toLowerCase().includes(q)).forEach(t=>r.push({type:'Team',name:t.name,sub:'Team',fn:()=>openTeam(t.id)}));players.filter(p=>(p.name+' '+(p.short_name||'')).toLowerCase().includes(q)).forEach(p=>r.push({type:'Player',name:p.name,sub:teamName(p.team_id,p.position||''),fn:()=>openPlayer(p.id)}));getCompetitionList().filter(c=>String(c.name).toLowerCase().includes(q)).forEach(c=>r.push({type:'Competition',name:c.name,sub:'Competition',fn:()=>openCompetition(c.id,c.name)}));matches.filter(m=>(teamDisplayName(m,'home')+' '+teamDisplayName(m,'away')+' '+(m.competition||'')).toLowerCase().includes(q)).forEach(m=>r.push({type:'Match',name:teamDisplayName(m,'home')+' vs '+teamDisplayName(m,'away'),sub:m.competition||'Match',fn:()=>openMatch(m.id)}));el.innerHTML=r.length?r.map((x,i)=>'<button class="search-result" onclick="searchOpen('+i+')"><strong>'+esc(x.name)+'</strong><span>'+esc(x.type)+' • '+esc(x.sub)+'</span></button>').join(''):'<div class="empty">No results.</div>';window._searchResults=r}
