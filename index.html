<script>
(function(){
 const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
 const poisson=(k,l)=>{let r=Math.exp(-l);for(let i=1;i<=k;i++)r*=l/i;return r};
 function predMatches(m){let ms=[];try{ms=competitionMatches(m.competition_id??m.competition,competitionNameForMatch(m))}catch{};return (ms&&ms.length?ms:matches).filter(isFinished)}
 function stats(id,ms){const r=ms.filter(x=>String(x.home_team_id)===String(id)||String(x.away_team_id)===String(id)).sort((a,b)=>(matchDate(b)+matchTime(b)).localeCompare(matchDate(a)+matchTime(a))).slice(0,12);let gf=0,ga=0,pts=0,hgf=0,hga=0,agf=0,aga=0,hn=0,an=0;r.forEach(x=>{const[h,a]=scoreOf(x),home=String(x.home_team_id)===String(id),f=home?h:a,g=home?a:h;gf+=f;ga+=g;pts+=f>g?3:f===g?1:0;if(home){hgf+=h;hga+=a;hn++}else{agf+=a;aga+=h;an++}});const n=r.length||1;return{n,gf:gf/n,ga:ga/n,form:pts/(3*n),hgf:hn?hgf/hn:gf/n,hga:hn?hga/hn:ga/n,agf:an?agf/an:gf/n,aga:an?aga/an:ga/n}}
 function realisticPredict(m){const ms=predMatches(m),h=stats(m.home_team_id,ms),a=stats(m.away_team_id,ms);let lg=1.35;if(ms.length){let g=0;ms.forEach(x=>{const[z,y]=scoreOf(x);g+=z+y});lg=clamp(g/(ms.length*2),.75,2.2)}const sh=(v,n)=>((v*n)+(lg*4))/(n+4);let lh=lg*(sh(h.hgf,h.n)/lg)*(sh(a.aga,a.n)/lg)*1.08,la=lg*(sh(a.agf,a.n)/lg)*(sh(h.hga,h.n)/lg)*.94;const fd=h.form-a.form;lh*=1+clamp(fd*.12,-.12,.12);la*=1-clamp(fd*.10,-.10,.10);lh=clamp(lh,.2,3.8);la=clamp(la,.2,3.8);let hp=0,dp=0,ap=0,best={p:0,h:0,a:0};for(let i=0;i<=6;i++)for(let j=0;j<=6;j++){const p=poisson(i,lh)*poisson(j,la);if(i>j)hp+=p;else if(i===j)dp+=p;else ap+=p;if(p>best.p)best={p,h:i,a:j}}const t=hp+dp+ap;hp/=t;dp/=t;ap/=t;return{home:hp,draw:dp,away:ap,best,lh,la,sample:ms.length,confidence:clamp(45+Math.abs(hp-ap)*80+(ms.length>=8?8:0),45,86)}}
 function predictor(m){if(isFinished(m)||isLive(m))return `<div class="card mi-panel"><div class="mi-head"><div><div class="eyebrow">Match Predictor</div><h3>Pre-match projection</h3></div><span class="muted">Closed after kick-off</span></div><div class="mi-muted">The prediction is intentionally hidden once the match begins.</div></div>`;const p=realisticPredict(m),hp=Math.round(p.home*100),dp=Math.round(p.draw*100),ap=Math.round(p.away*100);return `<div class="card mi-panel"><div class="mi-head"><div><div class="eyebrow">Match Predictor</div><h3>Statistical projection</h3><p class="muted">Competition results, home/away scoring, defence and recent form.</p></div><span class="pill">${p.sample} matches</span></div><div class="predict-grid"><div><strong>${hp}%</strong><span>${esc(teamDisplayName(m,'home'))}</span></div><div><strong>${dp}%</strong><span>Draw</span></div><div><strong>${ap}%</strong><span>${esc(teamDisplayName(m,'away'))}</span></div></div><div class="predict-bar"><i style="width:${hp}%"></i><i style="width:${dp}%"></i><i style="width:${ap}%"></i></div><div class="predict-score"><div><span class="predict-confidence">Most likely exact score</span><br><strong>${p.best.h}–${p.best.a}</strong></div><span class="predict-confidence">Model confidence ${Math.round(p.confidence)}%</span></div><div class="predict-method"><span>Home expected goals ${p.lh.toFixed(2)}</span><span>Away expected goals ${p.la.toFixed(2)}</span><span>Poisson model</span></div></div>`}
 function pos(p,i){const x=String(p.position||'').toLowerCase();if(/gk|goal/.test(x))return'GK';if(/cb|lb|rb|def|back/.test(x))return'DEF';if(/mid|dm|cm|am|wing/.test(x))return'MID';if(/st|cf|fw|forward|striker/.test(x))return'FWD';return['GK','DEF','DEF','DEF','DEF','MID','MID','MID','FWD','FWD','FWD'][i]}
 function coords(p,i){const g={GK:[[50,91]],DEF:[[18,72],[39,78],[61,78],[82,72]],MID:[[20,48],[40,58],[60,58],[80,48]],FWD:[[25,24],[50,18],[75,24]]};return(g[p]||g.MID)[i]||(g[p]||g.MID)[(g[p]||g.MID).length-1]}
 function side(m,side){const tid=side==='home'?m.home_team_id:m.away_team_id,t=teamById(tid),ids=readMatchLineups(m)[side]||[],ps=ids.map(playerById).filter(Boolean).slice(0,11),bench=players.filter(p=>String(p.team_id)===String(tid)&&!ids.map(String).includes(String(p.id))).sort((a,b)=>Number(b.overall||0)-Number(a.overall||0)).slice(0,7);const used={GK:0,DEF:0,MID:0,FWD:0};const marks=ps.map((p,i)=>{const q=pos(p,i),[x,y]=coords(q,used[q]++);return `<div class="vl-player ${side==='away'?'away':''}" style="left:${x}%;top:${y}%"><div class="vl-dot">${esc(p.shirt_number??'')}</div><div class="vl-name">${esc(p.short_name||p.name)}</div><div class="vl-pos">${q}</div></div>`}).join('');return `<div class="visual-lineup-side"><div class="vl-head"><strong>${esc(t?.name||teamDisplayName(m,side))}</strong><span>Starting XI • ${ps.length}</span></div>${ps.length?`<div class="vl-pitch"><div class="vl-half"></div>${marks}</div>`:'<div class="mc-empty">No starting XI available yet.</div>'}<div class="vl-bench"><div class="vl-bench-title">Squad / substitutes</div><div class="vl-bench-list">${bench.length?bench.map(p=>`<span class="vl-bench-player">${esc(p.short_name||p.name)}</span>`).join(''):'<span class="vl-bench-player">No additional players</span>'}</div></div></div>`}
 function lineups(m){return `<div class="card mc-panel"><div class="mc-panel-title"><div><div class="eyebrow">Team sheets</div><h3>Starting lineups</h3><p class="muted">Visual XI generated from the saved lineup and player positions.</p></div><span>5 players per side</span></div><div class="visual-lineup">${side(m,'home')}${side(m,'away')}</div></div>`}
 function table(m){const rows=buildLeagueTable(predMatches(m));return `<div class="card mc-table-panel"><div class="mc-panel-title"><div><div class="eyebrow">Competition table</div><h3>${esc(competitionNameForMatch(m))}</h3><div class="mc-table-note">Completed matches in this competition only.</div></div><span class="pill">${rows.length} teams</span></div>${rows.length?`<div class="standings-wrap"><table class="standings"><thead><tr><th>#</th><th>Team</th><th>PL</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${String(r.id)===String(m.home_team_id)||String(r.id)===String(m.away_team_id)?'leader':''}"><td class="pos">${i+1}</td><td class="team-cell">${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gd>0?'+':''}${r.gd}</td><td class="pts">${r.pts}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No completed matches are available for this competition.</div>'}</div>`}
 const rr=window.renderMatch;window.renderMatch=function(){rr();const m=matches.find(x=>String(x.id)===String(selectedMatchId)),el=document.getElementById('match-page');if(!m||!el)return;const tabs=el.querySelector('.mc-tabs');if(tabs&&!el.querySelector('[data-mctab="table"]')){const b=document.createElement('button');b.className='mc-tab';b.dataset.mctab='table';b.textContent='Table';b.onclick=()=>switchMatchTab('table');tabs.appendChild(b)}if(!el.querySelector('#mc-table')){const d=document.createElement('div');d.id='mc-table';d.className='mc-tab-panel';d.innerHTML=table(m);el.appendChild(d)}const l=el.querySelector('#mc-lineups');if(l)l.innerHTML=lineups(m);const mi=el.querySelector('#match-intelligence');if(mi){const cards=mi.querySelectorAll('.mi-panel');if(cards.length)cards[cards.length-1].outerHTML=predictor(m)}};
})();
</script>

<script>
/* CupWorks V14 — performance-only patch
   No UI, data model, match logic, or feature changes. This only coalesces
   repeated renders so realtime/database updates cannot block button clicks. */
(function(){
  const __mefcoOriginalRenderAll=renderAll;
  let __renderPending=false;
  let __renderTimer=0;
  let __lastRender=0;
  const __MIN_RENDER_GAP=80;

  function __runRender(){
    __renderPending=false;
    __renderTimer=0;
    const now=performance.now();
    const wait=Math.max(0,__MIN_RENDER_GAP-(now-__lastRender));
    if(wait>0){
      __renderPending=true;
      __renderTimer=setTimeout(__runRender,wait);
      return;
    }
    __lastRender=performance.now();
    try{__mefcoOriginalRenderAll()}catch(e){console.error('CupWorks render:',e)}
  }

  renderAll=function(){
    if(__renderPending)return;
    __renderPending=true;
    if(typeof requestIdleCallback==='function'){
      requestIdleCallback(__runRender,{timeout:120});
    }else{
      requestAnimationFrame(__runRender);
    }
  };

  /* Prevent rapid repeated refresh clicks from launching overlapping database loads. */
  const __originalRefreshData=refreshData;
  let __refreshBusy=false;
  refreshData=async function(){
    if(__refreshBusy){showToast('Refresh already in progress…');return}
    __refreshBusy=true;
    try{await __originalRefreshData()}finally{__refreshBusy=false}
  };

  /* News search: do not rebuild the entire newsroom on every keystroke. */
  let __newsSearchTimer=0;
  const __originalRenderNewsV3=typeof renderNewsV3==='function'?renderNewsV3:null;
  if(__originalRenderNewsV3){
    renderNewsV3=function(){
      __originalRenderNewsV3();
      const input=document.getElementById('newsSearch');
      if(input&&!input.dataset.perfBound){
        input.dataset.perfBound='1';
        input.oninput=function(){
          clearTimeout(__newsSearchTimer);
          const value=this.value;
          __newsSearchTimer=setTimeout(()=>{
            window.newsQuery=value;
            __originalRenderNewsV3();
          },120);
        };
      }
    };
  }

  /* Avoid repeatedly doing the same expensive lineup background pass. */
  let __lineupPassRunning=false;
  const __originalEnsureLineups=typeof ensureAutomaticLineups==='function'?ensureAutomaticLineups:null;
  if(__originalEnsureLineups){
    ensureAutomaticLineups=async function(){
      if(__lineupPassRunning)return;
      __lineupPassRunning=true;
      try{return await __originalEnsureLineups()}
      finally{__lineupPassRunning=false}
    };
  }

  /* Batch rapid realtime INSERT/UPDATE bursts into one UI render. */
  let __realtimeTimer=0;
  const __originalScheduleRender=typeof scheduleRender==='function'?scheduleRender:null;
  if(__originalScheduleRender){
    scheduleRender=function(){
      clearTimeout(__realtimeTimer);
      __realtimeTimer=setTimeout(()=>__originalScheduleRender(),50);
    };
  }
})();
</script>
