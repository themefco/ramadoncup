/* CupWorks final football-app visual polish */
:root{
  --cw-bg:#070b0a;
  --cw-bg-2:#0b1210;
  --cw-panel:#101815;
  --cw-panel-2:#141e1a;
  --cw-panel-3:#18251f;
  --cw-line:rgba(255,255,255,.095);
  --cw-line-strong:rgba(255,255,255,.15);
  --cw-text:#f7fbf8;
  --cw-muted:#96a59d;
  --cw-green:#66e58a;
  --cw-green-2:#27b965;
  --cw-lime:#c7ff5a;
  --cw-gold:#ffd166;
  --cw-red:#ff5f6d;
  --cw-blue:#57b8ff;
  --cw-shadow:0 20px 60px rgba(0,0,0,.34);

html{background:var(--cw-bg)!important;scroll-behavior:smooth}

    radial-gradient(900px 500px at 5% -5%,rgba(102,229,138,.13),transparent 62%),

}

async function supabaseFetch(url,options={}){
 const r=await fetch(url,{cache:options.cache||"no-store",...options,headers:{
  apikey:SUPABASE_KEY,
  Authorization:"Bearer "+SUPABASE_KEY,
  "Content-Type":"application/json",

 }});

 if(!r.ok){
  let info={};
  try{info=raw?JSON.parse(raw):{}}catch{}
  const err=new Error(info.message||raw||(`HTTP ${r.status}`));
  err.status=r.status;err.code=info.code||"";err.hint=info.hint||"";err.details=info.details||"";err.url=url;
  throw err;
 }
 if(!raw)return null;
 try{return JSON.parse(raw)}catch{return raw}
}
async function safeLoad(url,params){return supabaseFetch(url+"?"+new URLSearchParams(params||{}))}

async function loadData(){
 if(ADMIN_MODE&&lineupDraft.dirty)snapshotLineupDraftFromDOM();
 const previousMatches=matches.map(m=>({...m,events:[...(m.events||[])]}));

  loadTable(MATCHES_URL,{select:"*",order:"match_date.asc,match_time.asc",limit:500}),
  loadTable(NEWS_URL,{select:"*",order:"created_at.desc",limit:100}),
  loadTable(TEAMS_URL,{select:"*",order:"name.asc",limit:200}),
  loadTable(PLAYERS_URL,{select:"*",order:"name.asc",limit:2000}),
  loadTable(COMPETITIONS_URL,{select:"*",limit:100})
 ]);

 /* Never replace known-good data with an accidental empty fallback response.
    This prevents refreshes/network hiccups from making scores, fixtures or teams
    appear to reset. An actually empty database is still accepted on first load. */
 if(jobs[0].status==="fulfilled"&&Array.isArray(jobs[0].value)&&(jobs[0].value.length||matches.length===0)){
  const incomingMatches=jobs[0].value;
  /* Preserve a score while its PATCH is being verified. This prevents a stale
     refresh response from visually rolling a just-saved score back to 0-0. */
  for(const fresh of incomingMatches){
   const key=String(fresh.id),pending=pendingMatchWrites.get(key),known=matches.find(x=>String(x.id)===key);
   const pendingStatus=pendingStatusWrites.get(key);
   if(pendingStatus&&known)fresh.status=pendingStatus.status;
   if(pending&&known){fresh.score_home=Number(pending.score[0]);fresh.score_away=Number(pending.score[1]);}
   else if(verifiedScoreCache.has(key)){
    const cached=verifiedScoreCache.get(key);
    if(Number(fresh.score_home??0)!==cached[0]||Number(fresh.score_away??0)!==cached[1]){
     console.warn("CupWorks ignored stale score payload for",key);
     fresh.score_home=cached[0];fresh.score_away=cached[1];
    }
   }
  }
  matches=incomingMatches;
 }
 if(jobs[1].status==="fulfilled"&&Array.isArray(jobs[1].value)&&(jobs[1].value.length||news.length===0)) news=jobs[1].value;
 if(jobs[2].status==="fulfilled"&&Array.isArray(jobs[2].value)&&(jobs[2].value.length||teams.length===0)) teams=jobs[2].value;
 if(jobs[3].status==="fulfilled"&&Array.isArray(jobs[3].value)&&(jobs[3].value.length||players.length===0)) players=jobs[3].value;
 if(jobs[4].status==="fulfilled"&&Array.isArray(jobs[4].value)&&(jobs[4].value.length||competitions.length===0)) competitions=jobs[4].value;

 teams.sort((a,b)=>teamName(a.id,a.name||a.short_name||"").localeCompare(teamName(b.id,b.name||b.short_name||"")));
 players.sort((a,b)=>String(a.name||a.short_name||"").localeCompare(String(b.name||b.short_name||"")));
 competitions.sort((a,b)=>competitionName(a).localeCompare(competitionName(b)));
 news.sort((a,b)=>new Date(b.created_at||b.published_at||0)-new Date(a.created_at||a.published_at||0));
 eventsLoadedAll=false;for(const m of matches){const ev=eventCache.get(String(m.id));if(ev)m.events=ev.slice();}

async function loadAllEvents(){
 if(!matches.length)return true;
 try{
  /* Never use loadTable() here: its generic fallback can turn an events
     query failure into [] and make a refresh look like all events vanished. */
  const data=await safeLoad(EVENTS_URL,{select:"*",order:"minute.asc,created_at.asc"});

 }catch(e){
  console.error("CupWorks matches-events load failed:",e);

     Do not replace them with an empty array. */

  return false;
 }

function getCompetitionList(){

function buildLeagueTable(ms){
 const table=new Map();
 const ensure=(id,name,flag)=>{
  const key=String(id??name);
  if(!table.has(key))table.set(key,{id,name:name||"Unknown",flag:flag||"",p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0});
  return table.get(key);

 for(const m of ms){
  const hId=m.home_team_id??m.home, aId=m.away_team_id??m.away;
  const hName=teamDisplayName(m,"home"),aName=teamDisplayName(m,"away");
  const ht=teamById(hId),at=teamById(aId);
  ensure(hId,hName,teamFlag(ht)); ensure(aId,aName,teamFlag(at));
  if(!isFinished(m))continue;
  const [hg,ag]=scoreOf(m),h=ensure(hId,hName,teamFlag(ht)),a=ensure(aId,aName,teamFlag(at));
  h.p++;a.p++;h.gf+=hg;h.ga+=ag;a.gf+=ag;a.ga+=hg;
  if(hg>ag){h.w++;h.pts+=3;a.l++;}
  else if(hg<ag){a.w++;a.pts+=3;h.l++;}
  else{h.d++;a.d++;h.pts++;a.pts++;}

/* ---------- STRICT DATABASE SCHEMA ---------- */
/* AUTHORITATIVE CUPWORKS SUPABASE SCHEMA — only these application columns may be written. */
const CUPWORKS_MATCH_COLUMNS=new Set([
 "id","competition_id","home_team_id","away_team_id","match_date","match_time","venue","city","round","matchday",
 "score_home","score_away","status","minute","stoppage","metadata","created_at","updated_at"
]);
const CUPWORKS_EVENT_COLUMNS=new Set([
 "id","match_id","minute","stoppage","type","player_id","team_id","player","team","detail","data","created_at"
]);
function strictMatchPayload(changes){
 const out={};
 for(const [k,v] of Object.entries(changes||{}))if(CUPWORKS_MATCH_COLUMNS.has(k)&&v!==undefined)out[k]=v;
 return out;
}
function strictEventPayload(event){
 const out={};
 for(const [k,v] of Object.entries(event||{}))if(CUPWORKS_EVENT_COLUMNS.has(k)&&v!==undefined)out[k]=v;
 return out;
}

/* ---------- STATUS / DATABASE FIX ---------- */
async function updateMatch(id,changes){
 const m=matches.find(x=>String(x.id)===String(id));
 if(!m)return false;
 const previous={...m,metadata:readMatchMetadata(m)};
 const requested=strictMatchPayload(changes);

 /* NEVER allow an ordinary edit to change match status. */
 delete requested.status;
 /* Never accidentally write undefined values from a half-rendered form. */
 for(const key of Object.keys(requested))if(requested[key]===undefined)delete requested[key];
 /* Scores are ALWAYS stored in the canonical Supabase columns score_home/score_away. */
 for(const key of ["score_home","score_away","minute","stoppage"])if(Object.prototype.hasOwnProperty.call(requested,key))requested[key]=Math.max(0,Math.floor(Number(requested[key])||0));

 const hasScoreWrite=Object.prototype.hasOwnProperty.call(requested,"score_home")||Object.prototype.hasOwnProperty.call(requested,"score_away");
 const expectedScore=hasScoreWrite?[
  Object.prototype.hasOwnProperty.call(requested,"score_home")?requested.score_home:Number(m.score_home||0),
  Object.prototype.hasOwnProperty.call(requested,"score_away")?requested.score_away:Number(m.score_away||0)
 ]:null;
 const key=String(id);
 if(hasScoreWrite){
  pendingMatchWrites.set(key,{score:expectedScore,startedAt:Date.now()});
  verifiedScoreCache.set(key,expectedScore.slice());
 }

 try{
  await supabaseFetch(
   MATCHES_URL+"?id=eq."+encodeURIComponent(id),
   {method:"PATCH",body:JSON.stringify(requested),headers:{Prefer:"return=representation"}}
  );

  /* Critical protection: immediately read the row back and verify the score.
     A successful HTTP PATCH alone is not enough; this catches schema/triggers/RLS
     problems before a later refresh can make a saved score appear as 0-0. */
  if(hasScoreWrite){
   let verified=null;
   for(let attempt=0;attempt<2;attempt++){
    try{
     const rows=await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(id)+"&select=id,score_home,score_away,status,minute,stoppage");
     verified=Array.isArray(rows)?rows[0]:rows;
    }catch(readErr){
     if(attempt===1)throw readErr;
    }
    if(verified&&Number(verified.score_home??0)===expectedScore[0]&&Number(verified.score_away??0)===expectedScore[1])break;
    if(attempt===0){
     await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({score_home:expectedScore[0],score_away:expectedScore[1]}),headers:{Prefer:"return=minimal"}});
    }
   }
   if(!verified||Number(verified.score_home??0)!==expectedScore[0]||Number(verified.score_away??0)!==expectedScore[1]){
    throw new Error(`Score verification failed: database returned ${Number(verified?.score_home??0)}-${Number(verified?.score_away??0)} instead of ${expectedScore[0]}-${expectedScore[1]}`);
   }
  }
 }catch(e){
  pendingMatchWrites.delete(key);
  verifiedScoreCache.delete(key);
  Object.assign(m,previous);
  console.error("CupWorks database update failed:",e);
  showToast("Could not save: "+(e?.message||"database error"));
  return false;
 }

 /* The database write and, for scores, the read-back verification succeeded. */
 Object.assign(m,requested);
 if(hasScoreWrite)pendingMatchWrites.delete(key);
 addLog(`Updated ${teamDisplayName(m,"home")} vs ${teamDisplayName(m,"away")}: ${Object.keys(changes).join(", ")}`);

 try{renderAll()}catch(uiError){console.error("CupWorks render after save failed:",uiError)}
 return true;
}

async function persistStatus(id,status){
 const m=matches.find(x=>String(x.id)===String(id));
 if(!m)return false;
 status=String(status).toLowerCase();
 const allowed=["scheduled","live","halftime","finished","postponed","cancelled","abandoned"];
 if(!allowed.includes(status)){showToast("Invalid match status");return false}
 const current=String(m.status||"").toLowerCase();
 if(current==="finished"&&status!=="finished"){showToast("A finished match cannot be reset from here");return false}
 const key=String(id),previousStatus=current||"scheduled";
 pendingStatusWrites.set(key,{status,startedAt:Date.now()});
 try{
  showToast(status==="live"?"Starting match…":status==="finished"?"Finishing match…":"Updating match…");
  await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status}),headers:{Prefer:"return=minimal"}});
  let verified=null;
  for(let attempt=0;attempt<3;attempt++){
   const rows=await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(id)+"&select=id,status,score_home,score_away,minute,stoppage");
   verified=Array.isArray(rows)?rows[0]:rows;
   if(verified&&String(verified.status||"").toLowerCase()===status)break;
   if(attempt<2)await new Promise(r=>setTimeout(r,150*(attempt+1)));
  }
  if(!verified||String(verified.status||"").toLowerCase()!==status){
   throw new Error(`Status verification failed: database returned ${verified?.status||"empty"} instead of ${status}`);
  }
  Object.assign(m,verified,{status});
  pendingStatusWrites.delete(key);
  addLog(`Status changed to ${status}: ${teamDisplayName(m,"home")} vs ${teamDisplayName(m,"away")}`);
  try{renderAll()}catch(uiError){console.error("CupWorks status render failed:",uiError)}
  return true;
 }catch(e){
  pendingStatusWrites.delete(key);
  m.status=previousStatus;
  console.error("CupWorks status update:",e);
  showToast("Status was not saved: "+(e?.message||"database error"));
  return false;
 }
}

async function setLiveClockState(m,mode){
 if(!m)return false;
 const meta=readMatchMetadata(m);
 const currentMinute=Math.max(0,Math.floor(liveMinute(m)));
 if(mode==="start"){
  meta.clock={started_at:new Date().toISOString(),base_minute:currentMinute,base_stoppage:Number(m.stoppage||0)};
 }else{
  delete meta.clock;
 }
 const ok=await updateMatch(m.id,{minute:currentMinute,metadata:meta});
 if(ok){m.minute=currentMinute;m.metadata=meta;}
 return ok;
}

function liveMinute(m){
 if(!m)return 0;
 const base=Math.max(0,Math.floor(Number(m.minute)||0));
 const clock=readMatchMetadata(m).clock;
 if(!isLive(m)||!clock?.started_at)return base;
 const started=Date.parse(clock.started_at);
 if(!Number.isFinite(started))return base;
 const elapsed=Math.max(0,Date.now()-started);
 return base+Math.floor(elapsed/60000);
}

function liveDisplayMinute(m){
 const minute=liveMinute(m);
 return `${minute}${Number(m?.stoppage||0)>0?`+${Math.floor(Number(m.stoppage)||0)}`:""}'`;
}

 if(!clockOk){await persistStatus(id,String(m.status||"scheduled"));showToast("Match started, but the clock could not be initialized");return}
 m.status="live";startTimer();renderMatch();renderAdminPanel();showToast("Match is LIVE");
 cupworksPushMatchNotification(m,{title:"🏁 Match started",body:`${teamDisplayName(m,"home")} vs ${teamDisplayName(m,"away")} has started.`});
}

async function pauseSelected(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;
 const current=Math.max(0,Math.floor(liveMinute(m)));
 m.minute=current;
 const ok=await persistStatus(selectedMatchId,"halftime");
 if(!ok)return;
 stopTimer();
 const meta=readMatchMetadata(m);delete meta.clock;
 await updateMatch(m.id,{minute:current,metadata:meta});
 m.minute=current;m.metadata=meta;m.status="halftime";
 renderMatch();renderAdminPanel();showToast(`Half time • ${current}'`);
 cupworksPushMatchNotification(m,{title:"⏸️ Half-time",body:`${teamDisplayName(m,"home")} ${scoreOf(m)[0]}–${scoreOf(m)[1]} ${teamDisplayName(m,"away")} • Half time`});
}

async function syncPlayerTotalsFromEvents(){
 if(!eventsLoadedAll){
  const loaded=await loadAllEvents();
  if(!loaded)throw new Error('Could not load the complete event stream before syncing player totals');
 }
 const stats=eventStats();
 const jobs=[];
 for(const [id,row] of stats){
  const p=playerById(id);
  if(!p||id==null)continue;
  /* Only reconcile players that actually have event/lineup records. This preserves
     legacy database totals for players from seasons that have no event history. */
  const body={goals:Number(row.goals||0),assists:Number(row.assists||0),yellow_cards:Number(row.yellow_cards||0),red_cards:Number(row.red_cards||0)};
  jobs.push(supabaseFetch(PLAYERS_URL+"?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify(body),headers:{Prefer:"return=minimal"}}).then(()=>{Object.assign(p,body)}));
 }
 const results=await Promise.allSettled(jobs);
 const failed=results.filter(r=>r.status==='rejected');
 if(failed.length)throw new Error(`${failed.length} player statistic update${failed.length===1?'':'s'} failed`);
 return true;
}
async function syncCompletedMatchStats(match){
 if(!match)return false;
 try{
  /* Completion is a database checkpoint, not a second chance to increment
     player totals. Goals/cards/assists are already stored as events when they
     happen, and Stats derives its numbers from those events. Re-reading the
     finished match here guarantees the completion flow uses the database copy. */
  const events=await safeLoad(EVENTS_URL,{select:"*",match_id:"eq."+encodeURIComponent(match.id),order:"minute.asc,created_at.asc"});
  if(!Array.isArray(events))throw new Error("Invalid matches-events response");
  const metadata=readMatchMetadata(match);
  metadata.stats_synced_at=new Date().toISOString();
  metadata.stats_event_count=events.length;
  await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(match.id),{method:"PATCH",body:JSON.stringify({metadata}),headers:{Prefer:"return=minimal"}});
  match.events=events;
  /* Reconcile player totals after the final whistle. This makes the players table
     agree with the actual event stream, including goals that were recorded before
     this browser session existed. */
  await syncPlayerTotalsFromEvents();
  match.metadata=metadata;
  match.events=events;
  return true;
 }catch(e){
  console.error("CupWorks completed-match event sync failed:",e);
  showToast("Match finished, but event sync failed: "+(e?.message||"database error"));
  return false;
 }
}
async function finishSelected(){const m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;const he=document.getElementById('admHomeScore'),ae=document.getElementById('admAwayScore'),me=document.getElementById('admMinute'),se=document.getElementById('admStoppage');const homeScore=he?Math.max(0,Math.floor(Number(he.value)||0)):Math.max(0,Math.floor(Number(m.score_home)||0)),awayScore=ae?Math.max(0,Math.floor(Number(ae.value)||0)):Math.max(0,Math.floor(Number(m.score_away)||0)),minute=me?Math.max(0,Math.floor(Number(me.value)||0)):Math.max(0,Math.floor(isLive(m)?liveMinute(m):Number(m.minute)||0)),stoppage=se?Math.max(0,Math.floor(Number(se.value)||0)):Math.max(0,Math.floor(Number(m.stoppage)||0));showToast('Saving final score…');if(!await updateMatch(m.id,{score_home:homeScore,score_away:awayScore,minute,stoppage})){showToast('Match was not finished because the final score could not be saved.');return}if(!await persistStatus(m.id,'finished'))return;stopTimer();m.score_home=homeScore;m.score_away=awayScore;m.minute=minute;m.stoppage=stoppage;m.status='finished';delete readMatchMetadata(m).clock;showToast('Match finished — syncing events and stats…');cupworksPushMatchNotification(m,{title:"🏁 Full-time",body:`${teamDisplayName(m,"home")} ${scoreOf(m)[0]}–${scoreOf(m)[1]} ${teamDisplayName(m,"away")} • Full time`});await syncCompletedMatchStats(m);await loadData();const fresh=matches.find(x=>String(x.id)===String(m.id));if(fresh&&isFinished(fresh))showToast(`Final saved: ${scoreOf(fresh)[0]}–${scoreOf(fresh)[1]} • FULL TIME`);else if(fresh)showToast('Score saved, but status verification failed — check Supabase.');}


/* ---------- CLOCK: NEVER REBUILD DIRTY LINEUP EDITOR ---------- */
function startTimer(){
 stopTimer();
 const tick=async()=>{
  const m=matches.find(x=>String(x.id)===String(selectedMatchId));
  if(!m||!isLive(m))return;
  const minute=Math.max(0,Math.floor(liveMinute(m)));
  const previous=Number(m.minute||0);
  if(minute!==previous){
   const meta=readMatchMetadata(m);
   meta.clock={started_at:new Date().toISOString(),base_minute:minute,base_stoppage:Number(m.stoppage||0)};
   m.minute=minute;m.metadata=meta;
   try{
    await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(m.id),{method:"PATCH",body:JSON.stringify({minute,status:"live",metadata:meta}),headers:{Prefer:"return=minimal"}});
   }catch(e){console.warn("CupWorks clock persistence failed:",e)}
  }
  const min=document.getElementById("admMinute");if(min&&!document.activeElement?.matches?.("#admMinute"))min.value=minute;
  const em=document.getElementById("eventMinute");if(em&&!document.activeElement?.matches?.("#eventMinute"))em.value=minute;
  const om=document.getElementById("otherEventMinute");if(om&&!document.activeElement?.matches?.("#otherEventMinute"))om.value=minute;
  renderTicker();
  if(selectedMatchId){
   const current=matches.find(x=>String(x.id)===String(selectedMatchId));
   if(current){
    const [hh,aa]=scoreOf(current);
    const scoreEl=document.getElementById('mcLiveScore');
    const statusEl=document.getElementById('mcLiveStatus');
    const overviewScore=document.getElementById('mcOverviewScore');
    const overviewState=document.getElementById('mcOverviewState');
    const label=isLive(current)?`LIVE • ${Math.max(0,Math.floor(liveMinute(current)))}${Number(current.stoppage||0)>0?`+${Math.floor(Number(current.stoppage)||0)}`:''}'`:isFinished(current)?'FULL TIME':String(current.status||'SCHEDULED').toUpperCase();
    if(scoreEl)scoreEl.textContent=(isLive(current)||isFinished(current))?`${hh}–${aa}`:'VS';
    if(statusEl)statusEl.textContent=label;
    if(overviewScore)overviewScore.textContent=(isLive(current)||isFinished(current))?`${hh}–${aa}`:'VS';
    if(overviewState)overviewState.textContent=isFinished(current)?'Full time':isLive(current)?'Live match':'Upcoming fixture';
   }
  }
 };
 tick();
 timer=setInterval(tick,1000);
}
function stopTimer(){if(timer)clearInterval(timer);timer=null}
function resumeLiveTimer(){const live=matches.find(m=>String(m.id)===String(selectedMatchId)&&isLive(m));if(live)startTimer()}

/* ---------- EVENTS ---------- */
async function postEvent(event){
 /* Supabase uses UUIDs for match/team/player IDs. Never coerce them to Number. */
 const payload=strictEventPayload({...event,data:event.data&&typeof event.data==="object"?event.data:{}});
 const cleanId=v=>v==null?null:String(v).trim();
 payload.match_id=cleanId(payload.match_id);
 payload.team_id=cleanId(payload.team_id);
 payload.player_id=cleanId(payload.player_id);
 if(!payload.match_id)throw new Error("Invalid match_id for event");
 if(payload.team_id==="")payload.team_id=null;
 if(payload.player_id==="")payload.player_id=null;
 const result=await supabaseFetch(EVENTS_URL,{method:"POST",body:JSON.stringify(payload)});
 const row=Array.isArray(result)?result[0]:result;
 if(!row||row.id==null)throw new Error("Event INSERT returned no row. Check matches-events INSERT/SELECT policies.");
 try{
  const match=matches.find(x=>String(x.id)===String(row.match_id));
  if(match)cupworksPushMatchNotification(match,{event:row});
 }catch(e){console.warn("CupWorks event notification failed:",e)}
 return row;
}

}
async function adjustPlayerStat(playerId,field,delta){
 if(!playerId||!["goals","assists","yellow_cards","red_cards"].includes(field))return false;
 const p=playerById(playerId);

async function addGoalWithAssist(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));
 if(!m)return;
 if(addGoalWithAssist.busy){showToast("A goal is already being saved");return}
 addGoalWithAssist.busy=true;
 const teamId=String(document.getElementById("eventTeamSelect")?.value||"").trim();
 const playerId=String(document.getElementById("eventPlayerSelect")?.value||"").trim();
 const assistId=String(document.getElementById("eventAssistPlayerSelect")?.value||"").trim()||null;
 const minute=Math.max(0,Number(document.getElementById("eventMinute")?.value)||Number(m.minute)||0);
 const stoppage=Math.max(0,Number(document.getElementById("eventStoppage")?.value)||0);
 const matchId=String(m.id||"").trim();
 if(!teamId||!playerId||!matchId){showToast("Select the scoring team and scorer");addGoalWithAssist.busy=false;return}
 if(assistId&&assistId===playerId){showToast("Scorer and assister must be different");addGoalWithAssist.busy=false;return}
 const isHome=teamId===String(m.home_team_id||""),isAway=teamId===String(m.away_team_id||"");
 if(!isHome&&!isAway){showToast("Scoring team is not part of this match");addGoalWithAssist.busy=false;return}
 const p=playerById(playerId),ap=playerById(assistId);
 if(!p){showToast(`Player ${playerId} is not loaded in CupWorks`);addGoalWithAssist.busy=false;return}
 if(String(p.team_id)!==String(teamId)){showToast("The scorer is not assigned to the selected team");addGoalWithAssist.busy=false;return}
 if(assistId&&(!ap||String(ap.team_id)!==String(teamId))){showToast("The assister is not assigned to the selected team");addGoalWithAssist.busy=false;return}

 const oldHome=Number(m.score_home||0),oldAway=Number(m.score_away||0);
 const newScoreHome=isHome?oldHome+1:oldHome,newScoreAway=isAway?oldAway+1:oldAway;
 const created=[];
 let scoreSaved=false,goalStat=false,assistStat=false;
 const goalEvent={match_id:matchId,minute,stoppage,type:"goal",player_id:playerId,team_id:teamId,player:p.name||p.short_name||"",team:teamName(teamId,""),detail:assistId?`Assist: ${ap?.name||ap?.short_name||""}`:"",data:{}};
 const assistEvent=assistId?{match_id:matchId,minute,stoppage,type:"assist",player_id:assistId,team_id:teamId,player:ap.name||ap.short_name||"",team:teamName(teamId,""),detail:`For ${p.name||p.short_name||""}`,data:{}}:null;
 try{
  showToast("Saving goal…");

  /* 1. Save the new score to the database first. */
  const scoreOK=await updateMatch(m.id,{score_home:newScoreHome,score_away:newScoreAway});
  if(!scoreOK)throw new Error("Score could not be saved");
  scoreSaved=true;

  /* 2. Save the actual goal event. The event is now mandatory for success. */
  const goal=await postEvent(goalEvent);
  created.push(goal);
  await adjustPlayerStat(playerId,"goals",1);
  goalStat=true;

  /* 3. If an assist was selected, save it as its own event. */
  if(assistEvent){
   const assist=await postEvent(assistEvent);
   created.push(assist);
   await adjustPlayerStat(assistId,"assists",1);
   assistStat=true;
  }

  /* Local state is updated only after every database step succeeds. */
  m.events=m.events||[];
  created.forEach(e=>m.events.push(e));
  /* Re-read the authoritative match/event rows so the UI never renders a stale cache after a goal. */
  try{
   await loadMatchEvents(m.id,true);
   const fresh=await safeLoad(MATCHES_URL+"?id=eq."+encodeURIComponent(m.id)+"&select=*");
   const authoritative=Array.isArray(fresh)?fresh[0]:fresh;
   if(authoritative)Object.assign(m,authoritative);
   const ev=eventCache.get(String(m.id));if(ev)m.events=ev.slice();
  }catch(e){console.warn("CupWorks post-goal authoritative refresh failed",e)}
  try{renderAll()}catch(uiError){console.error("CupWorks goal render failed:",uiError)}
  showToast(assistId?"Goal + assist saved":"Goal saved");
 }catch(e){
  console.error("CupWorks goal transaction failed:",e);

  /* Roll back every part that succeeded. This prevents score-only ghosts. */
  for(const ev of created.slice().reverse()){
   try{await deleteEventRow(ev.id)}catch(re){console.error("Goal rollback event failed:",re)}
  }
  if(assistStat){try{await adjustPlayerStat(assistId,"assists",-1)}catch(re){console.error("Assist stat rollback failed:",re)}}
  if(goalStat){try{await adjustPlayerStat(playerId,"goals",-1)}catch(re){console.error("Goal stat rollback failed:",re)}}
  if(scoreSaved){
   try{
    await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(m.id),{method:"PATCH",body:JSON.stringify({score_home:oldHome,score_away:oldAway}),headers:{Prefer:"return=minimal"}});
    m.score_home=oldHome;m.score_away=oldAway;
   }catch(re){console.error("Score rollback failed:",re)}
  }
  try{await loadMatchEvents(selectedMatchId,true);renderAll()}catch(uiError){console.error("CupWorks rollback render failed:",uiError)}
  const detail=[e?.message,e?.code?`code ${e.code}`:"",e?.hint?`hint: ${e.hint}`:""].filter(Boolean).join(" — ");
  showToast("Goal NOT saved: "+(detail||"database error"));
 }finally{
  addGoalWithAssist.busy=false;
 }
}

async function deleteEvent(id){
 if(!id){showToast("This event has no database ID");return}
 const m=matches.find(x=>String(x.id)===String(selectedMatchId)),e=m?.events?.find(x=>String(x.id)===String(id));if(!e)return;
 const type=eventType(e);const oldScore=[Number(m.score_home||0),Number(m.score_away||0)];
 try{
  await deleteEventRow(id);
  let statField=null;
  if(type==="goal")statField="goals";
  if(type==="assist")statField="assists";
  if(type==="yellow")statField="yellow_cards";
  if(type==="red")statField="red_cards";
  if(statField&&e.player_id)await adjustPlayerStat(e.player_id,statField,-1);
  if(type==="goal"){
   const changes=String(e.team_id)===String(m.home_team_id)?{score_home:Math.max(0,oldScore[0]-1)}:String(e.team_id)===String(m.away_team_id)?{score_away:Math.max(0,oldScore[1]-1)}:null;
   if(changes&&!await updateMatch(m.id,changes))throw new Error("Goal event deleted but score update failed");
  }
  if(m)m.events=(m.events||[]).filter(x=>String(x.id)!==String(id));
  try{renderAll()}catch(uiError){console.error(uiError)}
  showToast("Event deleted");
 }catch(e2){
  console.error("CupWorks delete event failed",e2);
  showToast("Could not complete event deletion: "+(e2?.message||"database error"));
  /* Reload the server state so the UI never pretends a partial delete is clean. */
  try{await loadAllEvents();renderAll()}catch(re){console.error("CupWorks event reload failed",re)}
 }
}

function setupRealtime(){
 if(!window.supabase?.createClient||realtimeChannels.length)return;
 try{
  realtimeClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const eventsChannel=realtimeClient.channel("cupworks-events").on("postgres_changes",{event:"INSERT",schema:"public",table:"ramadoncup_matches_events"},payload=>{
   const e=payload.new,m=matches.find(x=>String(x.id)===String(e?.match_id));
   if(!m)return;
   m.events=m.events||[];if(!m.events.some(x=>String(x.id)===String(e.id)))m.events.push(e);eventCache.set(String(m.id),m.events.slice());try{window.cupworksCacheData?.()}catch{}
   notifyFavoriteEvent(m,e);
   try{scheduleRender()}catch(err){console.error("CupWorks realtime render:",err)}
  }).subscribe();
  const matchesChannel=realtimeClient.channel("cupworks-matches").on("postgres_changes",{event:"UPDATE",schema:"public",table:"ramadoncup_matches"},payload=>{
   const incoming=payload.new,old=payload.old||{},m=matches.find(x=>String(x.id)===String(incoming?.id));
   if(!m)return;
   const pendingStatus=pendingStatusWrites.get(String(incoming?.id));
   if(pendingStatus&&String(incoming?.status||"").toLowerCase()!==String(pendingStatus.status).toLowerCase()){
    console.warn("CupWorks ignored stale realtime status",incoming?.id,incoming?.status,"expected",pendingStatus.status);
    return;
   }
   const fav=isFavorite(m.id);
   const key=String(m.id);
   const oldScore=Number(m.score_home||0)+"-"+Number(m.score_away||0);
   const incomingScore=[Number(incoming.score_home??0),Number(incoming.score_away??0)];
   const pending=pendingMatchWrites.get(key);
   const pendingMatchesIncoming=!!pending&&incomingScore[0]===pending.score[0]&&incomingScore[1]===pending.score[1];
   /* Realtime is advisory, not authoritative during an in-flight score write.
      Never let a stale 0-0 payload overwrite a freshly verified score. */
   if(pending&&!pendingMatchesIncoming){
    const safeIncoming={...incoming};
    delete safeIncoming.score_home;delete safeIncoming.score_away;
    Object.assign(m,safeIncoming);
   }else{
    Object.assign(m,incoming);
    if(pendingMatchesIncoming){pendingMatchWrites.delete(key);verifiedScoreCache.set(key,incomingScore.slice());}
   }
   const newScore=Number(m.score_home||0)+"-"+Number(m.score_away||0);
   const scoreChanged=oldScore!==newScore,statusChanged=String(m.status||"")!==String(incoming.status||"");
   /* Server push is authoritative; realtime only updates the UI. */
   try{renderAll()}catch(err){console.error("CupWorks realtime match render:",err)}
  }).subscribe();
  realtimeChannels=[eventsChannel,matchesChannel];
 }catch(e){console.warn("CupWorks realtime unavailable:",e)}
}

function eventStats(){
 const out=new Map();
 const ensure=(id,name,team)=>{const k=String(id??name);if(!out.has(k))out.set(k,{id:id??k,name:name||"Unknown",team:team||"",goals:0,assists:0,yellow_cards:0,red_cards:0,appearances:0});return out.get(k)};
 for(const m of matches){const lineups=readMatchLineups(m);[...(lineups.home||[]),...(lineups.away||[])].forEach(id=>{if(id!=null){const p=playerById(id);ensure(id,p?.name||"Unknown",teamName(p?.team_id,""));}});for(const e of(m.events||[])){if(e.player_id==null)continue;const p=playerById(e.player_id),r=ensure(e.player_id,p?.name||p?.short_name||eventPlayer(e),teamName(p?.team_id||e.team_id,eventTeam(e))),t=eventType(e);if(t==="goal")r.goals++;else if(t==="assist")r.assists++;else if(t==="yellow")r.yellow_cards++;else if(t==="red")r.red_cards++;}}

async function loadMatchEvents(matchId,force=false){
 const key=String(matchId||'');if(!key)return false;
 if(!force&&eventCache.has(key)){const m=matches.find(x=>String(x.id)===key);if(m)m.events=(eventCache.get(key)||[]).slice();return true;}
 if(eventLoading.has(key)){
  const previous=eventLoading.get(key);
  if(!force)return previous;
  try{await previous}catch{}
 }
 const task=(async()=>{try{
  const data=await safeLoad(EVENTS_URL,{select:'*',match_id:'eq.'+key,order:'minute.asc,created_at.asc'});if(!Array.isArray(data))throw new Error('Invalid matches-events response');
  eventCache.set(key,data.slice());const m=matches.find(x=>String(x.id)===key);if(m)m.events=data.slice();try{window.cupworksCacheData?.()}catch{}return true;
 }catch(e){console.error('CupWorks match events load failed:',e);const m=matches.find(x=>String(x.id)===key);if(m&&!Array.isArray(m.events))m.events=[];showToast('Could not load match events: '+(e?.message||'database error'));return false;}finally{if(eventLoading.get(key)===task)eventLoading.delete(key)}})();
 eventLoading.set(key,task);return task;
}
async function loadEventsForMatchIds(ids){
 const unique=[...new Set((ids||[]).map(String).filter(Boolean))];if(!unique.length)return true;
 try{
  const data=await safeLoad(EVENTS_URL,{select:'*',match_id:'in.('+unique.join(',')+')',order:'minute.asc,created_at.asc'});if(!Array.isArray(data))throw new Error('Invalid matches-events response');
  const grouped=new Map(unique.map(id=>[id,[]]));for(const e of data){const k=String(e.match_id);if(grouped.has(k))grouped.get(k).push(e)}
  for(const [id,evs] of grouped){eventCache.set(id,evs);const m=matches.find(x=>String(x.id)===id);if(m)m.events=evs.slice();}try{window.cupworksCacheData?.()}catch{}return true;
 }catch(e){console.error('CupWorks bulk event load failed:',e);showToast('Could not load match statistics: '+(e?.message||'database error'));return false;}
}

/* Automatic lineups are generated from the players already assigned to each team.
   They are only written when a match has no saved lineup, so an admin's lineup is
   never silently replaced. */
function lineupPositionGroup(p){
 const x=String(p?.position||p?.position_group||p?.role||'').toLowerCase();
 if(/gk|goalkeeper|keeper/.test(x))return 'gk';
 if(/cb|centre.?back|center.?back|defen|full.?back|wing.?back|lb|rb|lwb|rwb|back/.test(x))return 'def';
 if(/mid|cm|dm|am|wing|lm|rm/.test(x))return 'mid';
 if(/st|striker|forward|attacker|cf|lw|rw/.test(x))return 'fwd';
 return 'other';
}
function playerRating(p){return Number(p?.overall??p?.ovr??p?.rating??p?.overall_rating??0)||0}
function autoSelectXI(teamId){
 const pool=players.filter(p=>String(p.team_id)===String(teamId));
 if(pool.length<=5)return pool.slice().sort((a,b)=>playerRating(b)-playerRating(a)).map(p=>String(p.id));
 const groups={gk:[],def:[],mid:[],fwd:[],other:[]};
 pool.forEach(p=>groups[lineupPositionGroup(p)].push(p));
 Object.values(groups).forEach(a=>a.sort((x,y)=>playerRating(y)-playerRating(x)));
 const selected=[];
 const take=(group,n)=>{for(const p of group){if(selected.length>=5||n<=0)break;if(!selected.includes(String(p.id))){selected.push(String(p.id));n--;}}};
 take(groups.gk,1);take(groups.def,2);take(groups.mid,1);take(groups.fwd,1);
 if(selected.length<5)take(groups.other,5-selected.length);
 if(selected.length<5)for(const p of pool.slice().sort((a,b)=>playerRating(b)-playerRating(a)))if(!selected.includes(String(p.id))){selected.push(String(p.id));if(selected.length===5)break;}
 return selected;
}
async function ensureAutomaticLineups(){
 const jobs=[];
 for(const m of matches){
  if(isFinished(m))continue;
  const saved=readMatchLineups(m);
  const h=players.filter(p=>String(p.team_id)===String(m.home_team_id)),a=players.filter(p=>String(p.team_id)===String(m.away_team_id));
  if(h.length<5||a.length<5)continue;
  const needHome=saved.home.length===0,needAway=saved.away.length===0;
  if(!needHome&&!needAway)continue;
  const meta=readMatchMetadata(m);
  meta.lineups={home:needHome?autoSelectXI(m.home_team_id):saved.home,away:needAway?autoSelectXI(m.away_team_id):saved.away};
  meta.lineups_source=meta.lineups_source||'automatic';
  meta.lineups_generated_at=meta.lineups_generated_at||new Date().toISOString();
  m.metadata=meta;
  jobs.push(supabaseFetch(MATCHES_URL+'?id=eq.'+encodeURIComponent(m.id),{method:'PATCH',body:JSON.stringify({metadata:meta}),headers:{Prefer:'return=minimal'}}).catch(e=>console.warn('Automatic lineup save failed',m.id,e)));
 }
 if(jobs.length)await Promise.allSettled(jobs);
}

function playerStatsForMatches(ms){
 const map=new Map();
 for(const m of ms){
  const lineups=readMatchLineups(m);
  [...lineups.home,...lineups.away].forEach(id=>{const p=playerById(id);if(p&&!map.has(String(id)))map.set(String(id),{...playerSeasonStats(p),goals:0,assists:0,yellow_cards:0,red_cards:0,appearances:0});});
  for(const e of (m.events||[])){if(e.player_id==null)continue;const id=String(e.player_id),p=playerById(e.player_id);if(!map.has(id))map.set(id,{id:e.player_id,name:p?.name||eventPlayer(e)||'Unknown',short_name:p?.short_name||p?.name||eventPlayer(e)||'Unknown',team:teamName(p?.team_id||e.team_id,eventTeam(e)),goals:0,assists:0,yellow_cards:0,red_cards:0,appearances:0});const r=map.get(id),t=eventType(e);if(t==='goal')r.goals++;else if(t==='assist')r.assists++;else if(t==='yellow')r.yellow_cards++;else if(t==='red')r.red_cards++;}
 }
 for(const [id,r] of map){r.appearances=ms.filter(m=>{const l=readMatchLineups(m);return l.home.concat(l.away).some(x=>String(x)===id)||(m.events||[]).some(e=>String(e.player_id)===id)}).length;}

const AI_REPORT_API=(window.CupWorks_AI_REPORT_API||'').trim();
function reportStatsForMatch(m){
 const [hg,ag]=scoreOf(m),events=m.events||[],goals=events.filter(e=>eventType(e)==='goal'),assists=events.filter(e=>eventType(e)==='assist'),cards=events.filter(e=>['yellow','red'].includes(eventType(e))),hs=teamEventStats(m.home_team_id),as=teamEventStats(m.away_team_id),ms=matchStoredStats(m);
 return {home:teamDisplayName(m,'home'),away:teamDisplayName(m,'away'),homeScore:hg,awayScore:ag,competition:competitionNameForMatch(m),date:matchDate(m),venue:m.venue||'',events:events.map(e=>({type:eventType(e),minute:e.minute||0,stoppage:e.stoppage||0,player:eventPlayer(e),team:eventTeam(e)})),goals:goals.map(e=>({minute:e.minute||0,player:eventPlayer(e),team:eventTeam(e)})),assists:assists.map(e=>({minute:e.minute||0,player:eventPlayer(e),team:eventTeam(e)})),cards:cards.map(e=>({minute:e.minute||0,type:eventType(e),player:eventPlayer(e),team:eventTeam(e)})),teamEventTotals:{home:hs,away:as},matchStats:ms};
}
function fallbackMatchReport(m){
 const d=reportStatsForMatch(m),winner=d.homeScore>d.awayScore?d.home:d.awayScore>d.homeScore?d.away:'Draw';
 const goalText=d.goals.length?d.goals.map(g=>`${g.player||'An unnamed player'} (${g.team||'team'}, ${g.minute}')`).join(', '):'No goals were recorded.';
 return {title:`${d.home} ${d.homeScore}–${d.awayScore} ${d.away}: match report`,category:'Match Report',excerpt:`${d.home} and ${d.away} met in ${d.competition||'CupWorks competition'} with ${winner==='Draw'?'the match ending level':winner+' taking the result'}.`,body:`${d.home} ${d.homeScore}–${d.awayScore} ${d.away}\n\n${winner==='Draw'?'The match ended in a draw.':winner+' secured the win.'} ${d.competition?`The fixture was part of ${d.competition}.`:''}\n\nGoals: ${goalText}\n\n${d.cards.length} card event${d.cards.length===1?'':'s'} The report is generated automatically from CupWorks match data.`};
}
async function requestAIReport(m){
 const payload=reportStatsForMatch(m);
 if(!AI_REPORT_API)return null;
 const r=await fetch(AI_REPORT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({match:payload,instructions:'Write a concise factual football match report from the supplied data. Do not invent events, quotes, statistics or player performances. Return JSON with title, excerpt, body and category.'})});
 if(!r.ok)throw new Error(await r.text()||`AI report endpoint returned ${r.status}`);
 const raw=await r.json();const x=raw.report||raw.data||raw;return x?.title&&x?.body?x:null;
}
async function insertNewsArticle(report,m){
 const now=new Date().toISOString();
 const candidates=[
  {title:report.title,body:report.body,excerpt:report.excerpt||'',category:report.category||'Match Report',published_at:now,created_at:now,updated_at:now},
  {title:report.title,body:report.body,excerpt:report.excerpt||'',category:report.category||'Match Report'},
  {title:report.title,body:report.body,excerpt:report.excerpt||''},
  {title:report.title,content:report.body,excerpt:report.excerpt||''},
  {title:report.title,body:report.body}
 ];
 let last=null;
 for(const payload of candidates){try{const result=await supabaseFetch(NEWS_URL,{method:'POST',body:JSON.stringify(payload)});const row=Array.isArray(result)?result[0]:result;if(row){news.unshift(row);return row;}}catch(e){last=e}}
 throw last||new Error('Could not insert generated news article');
}
async function publishAutomaticMatchReport(m,opts={}){
 if(!m||!isFinished(m))return false;
 const meta=readMatchMetadata(m);if(meta.match_report?.published_at&&!opts.force)return true;
 try{
  const ai=await requestAIReport(m);const report=ai||fallbackMatchReport(m);const row=await insertNewsArticle(report,m);
  meta.match_report={published_at:new Date().toISOString(),news_id:row?.id||null,mode:ai?'ai':'automatic-fallback'};
  await supabaseFetch(MATCHES_URL+'?id=eq.'+encodeURIComponent(m.id),{method:'PATCH',body:JSON.stringify({metadata:meta}),headers:{Prefer:'return=minimal'}});m.metadata=meta;
  return true;
 }catch(e){console.warn('Automatic match report failed',e);return false}
}
async function autoPublishFinishedReports(){
 const finished=matches.filter(isFinished).filter(m=>!readMatchMetadata(m).match_report?.published_at);

const _v9UpdateMatch=updateMatch;
updateMatch=async function(id,changes){
 const result=await _v9UpdateMatch(id,changes);
 if(!result)return false;
 const m=matches.find(x=>String(x.id)===String(id));
 if(!m)return true;
 try{
  const rows=await supabaseFetch(MATCHES_URL+'?id=eq.'+encodeURIComponent(id)+'&select=*');
  const db=Array.isArray(rows)?rows[0]:rows;

  for(const f of scoreFields)if(Object.prototype.hasOwnProperty.call(changes,f)&&Number(db[f]??0)!==Number(changes[f]??0))throw new Error('Verified database score mismatch');
  if(Object.prototype.hasOwnProperty.call(changes,'metadata'))m.metadata=db.metadata;
  return true;
 }catch(e){console.error('V9 database verification:',e);return false}
};

 window._cwSearchGroups=groups;

  return `<button type="button" class="cw-search-result" onclick="cwSearchOpen(${gi},${i})"><div class="cw-search-result-main"><strong>${esc(name)}</strong><span>${esc(sub)}</span></div><div class="cw-search-result-meta">${esc(meta)} <b>›</b></div></button>`;

/* Database health: read-only diagnostics for future bugs. */

/* ==================== CupWorks V11 RELIABILITY + DATA LAYER ==================== */
window.CupWorks_V11={version:'11.0'};
(function(){
  const CACHE_KEY='ramadoncup_watch_cache_v11';
  let loadBusy=false, loadSeq=0, cacheWriteTimer=null;
  /* Loading overlay removed: the shell is interactive immediately. */
  function hideBoot(){}
  function bootMessage(){}

  /* Network timeout: prevents Safari/iOS/slow mobile connections from hanging forever. */
  const _fetch=window.fetch.bind(window);
  window.fetch=async function(input,init={}){
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),18000);
    const opts={...init,signal:init.signal||ctl.signal};
    try{return await _fetch(input,opts)}catch(e){if(e?.name==='AbortError')throw new Error('Network request timed out');throw e}finally{clearTimeout(timer)}
  };

  /* Cross-device-safe local cache. Events are cached only for matches already loaded. */
  function cacheDataNow(){try{
    const cachedEvents={};let count=0;
    for(const [id,evs] of eventCache){if(count>=3000)break;const a=Array.isArray(evs)?evs.slice(0,3000-count):[];cachedEvents[id]=a;count+=a.length;}
    localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),matches,news:news.slice(0,100),teams,players,competitions,events:cachedEvents}));
  }catch{}}
  function cacheData(){
    if(cacheWriteTimer)return;
    const run=()=>{cacheWriteTimer=null;cacheDataNow()};
    if('requestIdleCallback' in window)cacheWriteTimer=requestIdleCallback(run,{timeout:1500});
    else cacheWriteTimer=setTimeout(run,300);
  }
  function restoreCache(){try{

  /* Database health: score/event/lineup integrity checks. */

    const issues=[];

  const _jump=jumpScoreDate;jumpScoreDate=function(v){if(/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))){scoreDate=String(v);renderScores();}};

<script>
(function(){

 function redCardRemainingText(card){if(!card?.until)return '';const sec=Math.ceil(Math.max(0,card.until-Date.now())/1000),min=Math.floor(sec/60),s=sec%60;return `${min}:${String(s).padStart(2,'0')}`;}
 function side(m,side){
 const tid=side==='home'?m.home_team_id:m.away_team_id,t=teamById(tid);

 const marks=ps.map((p,i)=>{

 }).join('');
 return `<div class="visual-lineup-side">
   <div class="vl-head"><strong>${esc(t?.name||teamDisplayName(m,side))}</strong><span>Starting 5 • ${ps.length}</span></div>

 function lineups(m){const [h,a]=scoreOf(m),ht=teamById(m.home_team_id),at=teamById(m.away_team_id);return `<div class="card mc-panel"><div class="cw-lineup-summary"><div class="cw-lineup-team">${ht&&teamFlag(ht)?`<img src="${esc(teamFlag(ht))}" alt="">`:''}<div><strong>${esc(teamDisplayName(m,'home'))}</strong><small class="muted">Home • Starting 5</small></div></div><div class="cw-lineup-score"><span>${isFinished(m)||isLive(m)?`${h}–${a}`:'VS'}</span><small>${isLive(m)?liveDisplayMinute(m):isFinished(m)?'Full time':'Lineups'}</small></div><div class="cw-lineup-team away"> <div><strong>${esc(teamDisplayName(m,'away'))}</strong><small class="muted">Away • Starting 5</small></div>${at&&teamFlag(at)?`<img src="${esc(teamFlag(at))}" alt="">`:''}</div></div><div class="mc-panel-title"><div><div class="eyebrow">Team sheets</div><h3>Starting 5</h3><p class="muted">Player photos come directly from each player's image_url.</p></div><span>5 players per side</span></div><div class="visual-lineup">${side(m,'home')}${side(m,'away')}</div><div class="cw-lineup-note">Cards are shown on the player marker. A temporary red card displays a live return countdown until the selected dismissal period expires.</div></div>`}

</script>

<script>

(function(){
  const __mefcoOriginalRenderAll=renderAll;
  let __renderPending=false;
  let __renderTimer=0;
  let __lastRender=0;
  const __MIN_RENDER_GAP=80;

  function __runRender(){
    __renderPending=false;
    __renderTimer=0;
    const now=performance.now();
    const wait=Math.max(0,__MIN_RENDER_GAP-(now-__lastRender));
    if(wait>0){
      __renderPending=true;
      __renderTimer=setTimeout(__runRender,wait);
      return;
    }
    __lastRender=performance.now();
    try{__mefcoOriginalRenderAll()}catch(e){console.error('CupWorks render:',e)}
  }

  renderAll=function(){
    if(__renderPending)return;
    __renderPending=true;
    if(typeof requestIdleCallback==='function'){
      requestIdleCallback(__runRender,{timeout:120});
    }else{
      requestAnimationFrame(__runRender);
    }
  };

  /* Prevent rapid repeated refresh clicks from launching overlapping database loads. */
  const __originalRefreshData=refreshData;
  let __refreshBusy=false;
  refreshData=async function(){
    if(__refreshBusy){showToast('Refresh already in progress…');return}
    __refreshBusy=true;
    try{await __originalRefreshData()}finally{__refreshBusy=false}
  };

  /* News search: do not rebuild the entire newsroom on every keystroke. */
  let __newsSearchTimer=0;
  const __originalRenderNewsV3=typeof renderNewsV3==='function'?renderNewsV3:null;
  if(__originalRenderNewsV3){
    renderNewsV3=function(){
      __originalRenderNewsV3();
      const input=document.getElementById('newsSearch');
      if(input&&!input.dataset.perfBound){
        input.dataset.perfBound='1';
        input.oninput=function(){
          clearTimeout(__newsSearchTimer);
          const value=this.value;
          __newsSearchTimer=setTimeout(()=>{
            window.newsQuery=value;
            __originalRenderNewsV3();
          },120);
        };
      }
    };
  }

  /* Avoid repeatedly doing the same expensive lineup background pass. */
  let __lineupPassRunning=false;
  const __originalEnsureLineups=typeof ensureAutomaticLineups==='function'?ensureAutomaticLineups:null;
  if(__originalEnsureLineups){
    ensureAutomaticLineups=async function(){
      if(__lineupPassRunning)return;
      __lineupPassRunning=true;
      try{return await __originalEnsureLineups()}
      finally{__lineupPassRunning=false}
    };
  }

  /* Batch rapid realtime INSERT/UPDATE bursts into one UI render. */
  let __realtimeTimer=0;
  const __originalScheduleRender=typeof scheduleRender==='function'?scheduleRender:null;
  if(__originalScheduleRender){
    scheduleRender=function(){
      clearTimeout(__realtimeTimer);
      __realtimeTimer=setTimeout(()=>__originalScheduleRender(),50);
    };
  }
})();

</script>



<script id="cupworks-notification-push-system">
/* CUPWORKS PUSH NOTIFICATIONS
   Based heavily on the MEFCO Watch Community notification implementation.
   Browser -> swnot.js -> CupWorks Worker -> Supabase/Web Push.
*/
const CUPWORKS_NOTIFICATION_PREFS_KEY='cupworks_notification_preferences_v5';
const CUPWORKS_NOTIFICATION_FOLLOWS_KEY='cupworks_notification_follows_v5';
let cupworksNotificationSubscription=null;

function cupworksReadJSON(key,fallback){
  try{
    const x=JSON.parse(localStorage.getItem(key)||'null');
    return x??fallback;
  }catch{return fallback}
}
function cupworksWriteJSON(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
function cupworksNotificationPrefs(){
  return {
    match_events:true,
    team_events:true,
    player_events:true,
    ...cupworksReadJSON(CUPWORKS_NOTIFICATION_PREFS_KEY,{})
  };
}
function cupworksNotificationFollows(){
  return cupworksReadJSON(CUPWORKS_NOTIFICATION_FOLLOWS_KEY,{match:[],team:[],player:[]});
}
function saveCupWorksNotificationFollows(x){cupworksWriteJSON(CUPWORKS_NOTIFICATION_FOLLOWS_KEY,x)}
function cupworksIsFollowing(type,id){
  return (cupworksNotificationFollows()[type]||[]).map(String).includes(String(id));
}
function cupworksFollowButton(type,id,label){
  const on=cupworksIsFollowing(type,id);
  return `<button type="button" class="btn small follow-btn ${on?'following':''}" onclick="toggleCupWorksNotificationFollow('${esc(type)}','${esc(id)}')">${on?'✓ Following':'＋ Follow'}${label?' '+esc(label):''}</button>`;
}

function cupworksBasePath(){
  return new URL('./',location.href).pathname;
}

async function ensureCupWorksPushSubscription(requestPermission=true){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return null;
  if(location.protocol!=='https:'&&location.hostname!=='localhost')return null;

  if(requestPermission&&Notification.permission!=='granted'){
    const permission=await Notification.requestPermission();
    if(permission!=='granted')return null;
  }
  if(Notification.permission!=='granted')return null;

  try{
    /* The service worker is intentionally the separate CupWorks swnot.js file. */
    const swUrl=new URL('swnot.js',location.href);
    const scope=cupworksBasePath();
    const reg=await navigator.serviceWorker.register(swUrl,{scope});
    await navigator.serviceWorker.ready;

    let sub=await reg.pushManager.getSubscription();

    if(!sub){
      const response=await fetch(NOTIFICATION_API+'/api/vapid-public-key',{
        method:'GET',
        headers:{'Accept':'application/json'}
      });
      if(!response.ok)throw new Error('Could not get VAPID public key');

      const data=await response.json();
      const publicKey=String(data.publicKey||'').trim();
      if(!publicKey)throw new Error('VAPID public key missing');

      const b64=publicKey.replace(/-/g,'+').replace(/_/g,'/');
      const pad='='.repeat((4-b64.length%4)%4);
      const bin=atob(b64+pad);
      const arr=Uint8Array.from(bin,c=>c.charCodeAt(0));

      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:arr
      });
    }

    cupworksNotificationSubscription=sub;

    const result=await fetch(NOTIFICATION_API+'/api/subscribe',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        subscription:sub.toJSON(),
        preferences:cupworksNotificationPrefs()
      })
    });

    if(!result.ok){
      const message=await result.text();
      throw new Error('Worker rejected subscription: '+message);
    }

    return sub.toJSON();
  }catch(e){
    console.error('CupWorks notification setup failed:',e);
    showToast('Notification setup failed. Check the console.');
    return null;
  }
}

async function syncCupWorksNotificationFollow(type,id,follow){
  const sub=await ensureCupWorksPushSubscription(!!follow);
  if(!sub)return false;

  const endpoint=follow?'/api/follow':'/api/unfollow';

  try{
    const response=await fetch(NOTIFICATION_API+endpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        subscription:sub,
        follow_type:type,
        target_id:String(id)
      })
    });

    if(!response.ok){
      console.warn('CupWorks follow sync rejected:',await response.text());
      return false;
    }
    return true;
  }catch(e){
    console.warn('CupWorks follow sync unavailable',e);
    return false;
  }
}

async function toggleCupWorksNotificationFollow(type,id){
  if(!['match','team','player'].includes(type)||id==null)return;

  const f=cupworksNotificationFollows();
  f[type]=Array.from(new Set([...(f[type]||[]).map(String)]));
  const key=String(id);
  const exists=f[type].includes(key);

  if(exists)f[type]=f[type].filter(x=>x!==key);
  else f[type].push(key);

  saveCupWorksNotificationFollows(f);

  const synced=await syncCupWorksNotificationFollow(type,id,!exists);
  if(!synced){
    /* Revert local state if the server did not accept the change. */
    const rollback=cupworksNotificationFollows();
    rollback[type]=rollback[type]||[];
    if(exists){
      if(!rollback[type].map(String).includes(key))rollback[type].push(key);
    }else{
      rollback[type]=rollback[type].map(String).filter(x=>x!==key);
    }
    saveCupWorksNotificationFollows(rollback);
    showToast('Notification follow could not be synced');
  }else{
    showToast(exists?'Unfollowed':'Followed — personalized notifications enabled');
  }

  renderAll();
}

  const f=cupworksNotificationFollows();

    }catch{}
  }

}

async function cupworksPushMatchNotification(match,info={}){
 try{
  if(!match)return false;
  const targets=[{follow_type:"match",target_id:String(match.id)}];
  if(match.home_team_id)targets.push({follow_type:"team",target_id:String(match.home_team_id)});
  if(match.away_team_id)targets.push({follow_type:"team",target_id:String(match.away_team_id)});
  const e=info.event;if(e?.player_id)targets.push({follow_type:"player",target_id:String(e.player_id)});
  let title=String(info.title||"Match update");
  let body=String(info.body||`${teamDisplayName(match,"home")} ${scoreOf(match)[0]}–${scoreOf(match)[1]} ${teamDisplayName(match,"away")}`);
  let tag=`cupworks-match-${String(match.id)}`;
  if(e){
   const t=eventType(e);
   const labels={goal:"⚽ Goal",assist:"🅰️ Assist",yellow:"🟨 Yellow card",red:"🟥 Red card",other:"📣 Match event"};
   title=labels[t]||`📣 ${t||"Match event"}`;
   const who=eventPlayer(e)||eventTeam(e)||"Match event";
   const minute=Number(e.minute||0)>0?` • ${Number(e.minute)}'${Number(e.stoppage||0)>0?`+${Number(e.stoppage)}`:""}`:"";
   body=`${teamDisplayName(match,"home")} ${scoreOf(match)[0]}–${scoreOf(match)[1]} ${teamDisplayName(match,"away")} • ${who}${minute}${e.detail?` • ${e.detail}`:""}`;
   tag=`cupworks-event-${String(e.id)}`;
  }
  const response=await fetch(NOTIFICATION_API+"/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,body,url:location.href,tag,renotify:true,targets})});
  if(!response.ok){console.warn("CupWorks push rejected:",await response.text());return false}
  return true;
 }catch(error){console.warn("CupWorks server push unavailable:",error);return false}
}

/* Existing in-page fallback for events while the real server push subscription is active. */
function cupworksNotifyOnce(kind,id,title,body){
  if(typeof Notification==='undefined'||Notification.permission!=='granted'||id==null)return false;
  const key=`cupworks_notification_seen_v5:${kind}:${String(id)}`;
  try{
    if(localStorage.getItem(key)==='1')return false;
    localStorage.setItem(key,'1');
  }catch{}
  const options={body,tag:`cupworks-${kind}-${String(id)}`,data:{url:location.href}};
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,options)).catch(()=>{});
      return true;
    }
    new Notification(title,options);
    return true;
  }catch{return false}
}

<script>
(function(){
  /* Normalize pasted media URLs, including common WhatsApp CDN URLs. */
  const __cwOriginalSafeMediaUrl = safeMediaUrl;
  safeMediaUrl = function(value){
    let raw=String(value??'').trim();
    if(!raw)return '';
    raw=raw.replace(/^['"]+|['"]+$/g,'').replace(/^<|>$/g,'').replace(/\s+/g,'');
    if(/^https?:\/\//i.test(raw))raw=raw.replace(/^http:\/\//i,'https://');
    try{
      const u=new URL(raw,location.href);
      if(!['http:','https:','data:','blob:'].includes(u.protocol))return '';
      if(['data:','blob:'].includes(u.protocol)||u.origin===location.origin)return u.href;
      return CUPWORKS_IMAGE_PROXY+'?url='+encodeURIComponent(u.href);
    }catch{return __cwOriginalSafeMediaUrl(raw)}
  };

  function cwImage(src,alt='',className=''){
    const url=safeMediaUrl(src);
    if(!url)return '';
    const fallback=(alt||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
    return `<img class="${className}" src="${esc(url)}" alt="${esc(alt)}" loading="eager" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none';this.parentElement.classList.add('cw-image-missing');this.parentElement.setAttribute('data-fallback','${esc(fallback)}')">`;
  }

  function normalizedEventType(e){
    const raw=String(e?.type||e?.event_type||'event').toLowerCase().trim().replace(/[\s-]+/g,'_');
    const aliases={goal_scored:'goal',goal_event:'goal',yellow_card:'yellow',yellowcard:'yellow',red_card:'red',redcard:'red',assistance:'assist',var_check:'var',video_assistant_referee:'var'};
    return aliases[raw]||raw||'event';
  }
  eventType=normalizedEventType;
  function eventLabel(e){
    const t=normalizedEventType(e);
    return ({goal:'Goal',assist:'Assist',yellow:'Yellow card',red:'Red card',var:'VAR',other:'Match event'})[t]||t.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  }
  function eventIconV2(type){
    const t=normalizedEventType({type});
    return t==='goal'?'⚽':t==='assist'?'A':t==='yellow'?'🟨':t==='red'?'🟥':t==='var'?'VAR':'•';
  }
  eventIcon=eventIconV2;

  matchEventRow=function(e){
    const minute=Math.max(0,Number(e?.minute)||0),stoppage=Math.max(0,Number(e?.stoppage)||0),t=normalizedEventType(e);
    const player=eventPlayer(e),team=eventTeam(e),extra=[];
    if(e?.data?.temporary&&Number(e.data.duration_minutes)>0)extra.push(`Temporary red • ${Number(e.data.duration_minutes)} min`);
    if(e?.detail)extra.push(String(e.detail));
    return `<div class="mc-event"><div class="mc-event-minute">${minute}${stoppage?`+${stoppage}`:''}'</div><div class="mc-event-icon ${esc(t)}">${eventIconV2(t)}</div><div class="mc-event-copy"><strong>${esc(player||team||'Match event')}</strong><span class="cw-event-type">${esc(eventLabel(e))}</span>${extra.length?`<span class="cw-event-detail">${esc(extra.join(' • '))}</span>`:''}</div><div class="mc-event-team">${esc(team||'')}</div></div>`;
  };

  function playerInitials(p){return esc((p?.short_name||p?.name||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase())}
  function activeRed(m,pid){
    const now=Date.now();
    return (m?.events||[]).filter(e=>normalizedEventType(e)==='red'&&String(e.player_id)===String(pid)).map(e=>({e,until:Date.parse(e?.data?.red_card_until||''),duration:Number(e?.data?.duration_minutes||0)})).filter(x=>x.duration>=1&&x.duration<=10&&Number.isFinite(x.until)&&x.until>now).sort((a,b)=>b.until-a.until)[0]||null;
  }
  function lineupPositions(side){
    /* Five-a-side football layout, left-to-right across the horizontal pitch. */
    return side==='home'
      ? [[10,50],[23,24],[23,76],[37,36],[37,64]]
      : [[90,50],[77,24],[77,76],[63,36],[63,64]];
  }
  renderLineupSide=function(m,side){
    const tid=side==='home'?m.home_team_id:m.away_team_id,t=teamById(tid);
    const saved=(readMatchLineups(m)[side]||[]).map(String).filter(Boolean);
    const squad=players.filter(p=>String(p.team_id)===String(tid));
    const ids=saved.length?saved:squad.slice().sort((a,b)=>Number(b.overall||0)-Number(a.overall||0)||String(a.name||'').localeCompare(String(b.name||''))).slice(0,5).map(p=>String(p.id));
    const ps=ids.map(playerById).filter(Boolean).slice(0,5),pos=lineupPositions(side);
    const [scoreHome,scoreAway]=scoreOf(m),logo=teamFlag(t);
    const cards=ps.map((p,i)=>{
      const red=activeRed(m,p.id),photo=safeMediaUrl(p?.image_url||playerImage(p)),[x,y]=pos[i]||pos[pos.length-1],events=(m.events||[]).filter(e=>String(e.player_id)===String(p.id)&&['yellow','red'].includes(normalizedEventType(e))),last=events[events.length-1],badge=last?`<span class="cw-pitch-player-badge ${normalizedEventType(last)==='red'?'red':''}">${normalizedEventType(last)==='red'?'RED':'YEL'}</span>`:'';
      return `<div class="cw-pitch-player ${side}" style="left:${x}%;top:${y}%"><div class="cw-fut-card ${side}"><div class="cw-fut-top"><span class="cw-fut-ovr">${esc(p.overall??'—')}</span><span class="cw-fut-pos">${esc((p.position||'').slice(0,3).toUpperCase())}</span></div><div class="cw-fut-photo">${photo?`<img src="${esc(photo)}" alt="" loading="eager" data-cw-source="${esc(photo)}" onerror="this.style.display='none';this.parentElement?.classList.add('image-missing')">`:playerInitials(p)}</div><div class="cw-fut-name">${esc(p.short_name||p.name)}</div><div class="cw-fut-meta"><span>${esc(t?.short_name||t?.name||teamDisplayName(m,side))}</span><span>${esc(p.nationality||'')}</span></div><div class="cw-fut-line"></div><div class="cw-fut-stats"><span><b>${esc(p.goals??0)}</b> G</span><span><b>${esc(p.assists??0)}</b> A</span><span><b>${esc(p.overall??'—')}</b> OVR</span></div>${badge}</div></div>`;
    }).join('');
    return `<div class="lineup-side cw-lineup-board"><div class="cw-lineup-score-strip"><div class="cw-score-team">${logo?cwImage(logo,t?.name||'Team',''):''}<span>${esc(t?.name||teamDisplayName(m,side))}</span></div><div class="cw-score-main">${isFinished(m)||isLive(m)?`${scoreHome}–${scoreAway}`:'VS'}<small>${isLive(m)?liveDisplayMinute(m):isFinished(m)?'Full time':'Starting 5'}</small></div><div></div></div><div class="cw-football-pitch-wrap"><div class="cw-lineup-team-label"><div><strong>${esc(t?.name||teamDisplayName(m,side))}</strong><small>${side==='home'?'Home':'Away'} • ${ps.length}/5 selected</small></div></div><div class="cw-football-pitch"><div class="cw-pitch-halfway"></div><div class="cw-pitch-circle"></div><div class="cw-box home"></div><div class="cw-box away"></div><div class="cw-goal-box home"></div><div class="cw-goal-box away"></div>${cards||'<div class="mc-empty" style="position:absolute;inset:40% 25%;z-index:5">No starting lineup published.</div>'}</div></div></div>`;
  };

})();
</script>





<script id="cupworks-image-proxy-client">
(function(){
  function proxySource(src){
    try{
      const u=new URL(String(src||""),location.href);
      if(!/^https?:$/.test(u.protocol)||u.origin===location.origin)return null;
      return CUPWORKS_IMAGE_PROXY+"?url="+encodeURIComponent(u.href);
    }catch{return null}
  }
  document.addEventListener('error',function(ev){
    const img=ev.target;
    if(!(img instanceof HTMLImageElement)||img.dataset.cwProxyTried==='1')return;
    const original=img.dataset.cwSource||img.currentSrc||img.src;
    const proxy=proxySource(original);
    if(!proxy)return;
    img.dataset.cwProxyTried='1';
    img.src=proxy;
  },true);
})();
</script>

<script>
/* Mobile push guidance: Android browsers can use standard Web Push without installation.
   iOS/iPadOS Safari requires a Home Screen web app for Web Push, so we explain that instead of pretending it works. */
(function(){
  const originalEnable=window.enableNotifications;
  window.enableNotifications=async function(){
    const ua=navigator.userAgent||'';
    const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const isStandalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;
    if(isIOS&&!isStandalone){
      showToast('On iPhone/iPad, Web Push requires CupWorks to be added to the Home Screen.');
      return;
    }
    return originalEnable?.();
  };
})();
</script>
