<script>
const SUPABASE_URL="https://dejtiuljlsxohplqbifd.supabase.co";
const SUPABASE_KEY="sb_publishable_9epN3-6PkMRhxAm5gjjXMA_ekwLgLtR";
const MATCHES_URL=SUPABASE_URL+"/rest/v1/ramadoncup_matches";
const EVENTS_URL=SUPABASE_URL+"/rest/v1/ramadoncup_matches_events";
const NEWS_URL=SUPABASE_URL+"/rest/v1/ramadoncup_news";

const NOTIFICATION_API="https://mefco-notifications.drtwelveyt.workers.dev";
let realtimeClient=null,realtimeChannels=[];
const ADMIN_MODE=new URLSearchParams(location.search).get("admin")==="1";

let matches=[],news=[],teams=[],players=[],competitions=[];
const pendingMatchWrites=new Map(),pendingStatusWrites=new Map();
const verifiedScoreCache=new Map();
/* Event data is loaded on demand to reduce Supabase traffic. */
const eventCache=new Map(),eventLoading=new Map();
let eventsLoadedAll=false;
let selectedMatchId=null,selectedArticleId=null,selectedCompetition=null;
let scoreFilter="all",scoreDate=todayISO(),adminLog=[],timer=null,refreshTimer=null,dbOnline=false;
let adminFilter="all";

/* V2 LINEUP DRAFT STATE */
let lineupDraft={matchId:null,home:[],away:[],dirty:false};

const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateObj(s){const [y,m,d]=String(s||todayISO()).split("-").map(Number);return new Date(y,m-1,d)}
function localISO(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function shiftISO(s,n){const d=dateObj(s);d.setDate(d.getDate()+Number(n||0));return localISO(d)}
function fmtDate(s,opts={weekday:"short",month:"short",day:"numeric"}){return new Intl.DateTimeFormat(undefined,opts).format(dateObj(s))}
function fmtTime(t){return t?String(t).slice(0,5):"—"}
function matchDate(m){return String(m?.match_date??m?.date??todayISO()).slice(0,10)}
function matchTime(m){return m?.match_time||m?.time||"00:00"}
function scoreOf(m){return[Number(m?.score_home??m?.home_score??0),Number(m?.score_away??m?.away_score??0)]}
function isLive(m){return String(m?.status||"").toLowerCase()==="live"}
function isFinished(m){return String(m?.status||"").toLowerCase()==="finished"}
function teamById(id){return teams.find(t=>String(t.id)===String(id))}
function playerById(id){return players.find(p=>String(p.id)===String(id))}
function teamName(id,fallback="Unknown"){const t=teamById(id);return t?.name||t?.short_name||fallback}
function playerImage(p){return p?.photo_url||p?.image_url||p?.photo||p?.image||p?.avatar_url||p?.avatar||p?.picture_url||p?.profile_image||""}
function competitionName(c,fallback="Competition"){return c?.name||c?.title||c?.short_name||c?.competition||fallback}
function competitionById(id){return competitions.find(c=>String(c.id)===String(id))}
function competitionNameForMatch(m){return competitionName(competitionById(m?.competition_id),m?.competition||"CupWorks")}
function teamFlag(t){return t?.flag_url||t?.logo_url||t?.image_url||t?.crest_url||""}
function safeMediaUrl(value){const u=String(value||"").trim();if(!u)return"";try{const x=new URL(u,location.href);return["http:","https:","data:","blob:"].includes(x.protocol)?x.href:""}catch{return""}}
function teamDisplayName(m,side){const id=side==="home"?m.home_team_id:m.away_team_id;return teamName(id,side==="home"?m.home:m.away)}
function eventType(e){return String(e?.type||e?.event_type||"event").toLowerCase()}
function eventPlayer(e){const p=playerById(e?.player_id);return p?.short_name||p?.name||e?.player_name||e?.player||""}
function eventTeam(e){return teamById(e?.team_id)?.name||e?.team||""}
function showToast(msg){const t=document.getElementById("toast");if(!t)return;t.textContent=msg;t.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove("show"),2600)}

async function supabaseFetch(url,options={}){
 const r=await fetch(url,{...options,headers:{
  apikey:SUPABASE_KEY,
  Authorization:"Bearer "+SUPABASE_KEY,
  "Content-Type":"application/json",
  Prefer:"return=representation",
  ...(options.headers||{})
 }});
 const raw=await r.text();
 if(!r.ok){
  let info={};
  try{info=raw?JSON.parse(raw):{}}catch{}
  const err=new Error(info.message||raw||(`HTTP ${r.status}`));
  err.status=r.status;err.code=info.code||"";err.hint=info.hint||"";err.details=info.details||"";err.url=url;
  throw err;
 }
 if(!raw)return null;
 try{return JSON.parse(raw)}catch{return raw}
}
async function safeLoad(url,params){return supabaseFetch(url+"?"+new URLSearchParams(params||{}))}
async function loadTable(url,params={},fallbackParams={select:"*"}){try{return await safeLoad(url,params)}catch(first){if(JSON.stringify(params)===JSON.stringify(fallbackParams))throw first;try{return await safeLoad(url,fallbackParams)}catch{return[]}}}

/* ---------- LINEUP V2 HELPERS ---------- */
function readMatchMetadata(m){
 let meta={};
 try{meta=typeof m?.metadata==="string"?JSON.parse(m.metadata||"{}"):(m?.metadata||{})}catch{}
 return meta&&typeof meta==="object"?meta:{};
}
function readMatchLineups(m){
 const meta=readMatchMetadata(m);
 return{
  home:Array.isArray(meta?.lineups?.home)?meta.lineups.home.map(String):[],
  away:Array.isArray(meta?.lineups?.away)?meta.lineups.away.map(String):[]
 };
}
function resetLineupDraft(m){
 const saved=readMatchLineups(m);
 lineupDraft={
  matchId:m?.id??null,
  home:saved.home.slice(0,11),
  away:saved.away.slice(0,11),
  dirty:false
 };
}
function ensureLineupDraft(m){
 if(!m)return;
 if(String(lineupDraft.matchId)!==String(m.id))resetLineupDraft(m);
}
function snapshotLineupDraftFromDOM(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));
 if(!m)return;
 const homeEls=[...document.querySelectorAll(".home-lineup")];
 const awayEls=[...document.querySelectorAll(".away-lineup")];
 if(!homeEls.length&&!awayEls.length)return;
 lineupDraft={
  matchId:m.id,
  home:homeEls.map(s=>s.value),
  away:awayEls.map(s=>s.value),
  dirty:true
 };
 updateLineupDraftIndicator();
}
function handleLineupChange(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));
 if(!m)return;
 lineupDraft={
  matchId:m.id,
  home:[...document.querySelectorAll(".home-lineup")].map(s=>s.value),
  away:[...document.querySelectorAll(".away-lineup")].map(s=>s.value),
  dirty:true
 };
 updateLineupDraftIndicator();
}
function updateLineupDraftIndicator(){
 const el=document.getElementById("lineupDraftIndicator");
 if(el)el.textContent=lineupDraft.dirty?"Unsaved changes":"Saved";
}
function lineupIdsFromEditor(side){return[...document.querySelectorAll("."+side+"-lineup")].map(s=>s.value).filter(Boolean)}
function getDraftSide(m,side){ensureLineupDraft(m);return lineupDraft[side]||[]}

/* ---------- DATA ---------- */
async function loadData(){
 if(ADMIN_MODE&&lineupDraft.dirty)snapshotLineupDraftFromDOM();
 const previousMatches=matches.map(m=>({...m,events:[...(m.events||[])]}));

 const jobs=await Promise.allSettled([
  loadTable(MATCHES_URL,{select:"*",order:"match_date.asc,match_time.asc",limit:500}),
  loadTable(NEWS_URL,{select:"*",order:"created_at.desc",limit:100}),
  loadTable(TEAMS_URL,{select:"*",order:"name.asc",limit:200}),
  loadTable(PLAYERS_URL,{select:"*",order:"name.asc",limit:2000}),
  loadTable(COMPETITIONS_URL,{select:"*",limit:100})
 ]);

 /* Never replace known-good data with an accidental empty fallback response.
    This prevents refreshes/network hiccups from making scores, fixtures or teams
    appear to reset. An actually empty database is still accepted on first load. */
 if(jobs[0].status==="fulfilled"&&Array.isArray(jobs[0].value)&&(jobs[0].value.length||matches.length===0)){
  const incomingMatches=jobs[0].value;
  /* Preserve a score while its PATCH is being verified. This prevents a stale
     refresh response from visually rolling a just-saved score back to 0-0. */
  for(const fresh of incomingMatches){
   const key=String(fresh.id),pending=pendingMatchWrites.get(key),known=matches.find(x=>String(x.id)===key);
   const pendingStatus=pendingStatusWrites.get(key);
   if(pendingStatus&&known)fresh.status=pendingStatus.status;
   if(pending&&known){fresh.score_home=Number(pending.score[0]);fresh.score_away=Number(pending.score[1]);}
   else if(verifiedScoreCache.has(key)){
    const cached=verifiedScoreCache.get(key);
    if(Number(fresh.score_home??0)!==cached[0]||Number(fresh.score_away??0)!==cached[1]){
     console.warn("CupWorks ignored stale score payload for",key);
     fresh.score_home=cached[0];fresh.score_away=cached[1];
    }
   }
  }
  matches=incomingMatches;
 }
 if(jobs[1].status==="fulfilled"&&Array.isArray(jobs[1].value)&&(jobs[1].value.length||news.length===0)) news=jobs[1].value;
 if(jobs[2].status==="fulfilled"&&Array.isArray(jobs[2].value)&&(jobs[2].value.length||teams.length===0)) teams=jobs[2].value;
 if(jobs[3].status==="fulfilled"&&Array.isArray(jobs[3].value)&&(jobs[3].value.length||players.length===0)) players=jobs[3].value;
 if(jobs[4].status==="fulfilled"&&Array.isArray(jobs[4].value)&&(jobs[4].value.length||competitions.length===0)) competitions=jobs[4].value;

 teams.sort((a,b)=>teamName(a.id,a.name||a.short_name||"").localeCompare(teamName(b.id,b.name||b.short_name||"")));
 players.sort((a,b)=>String(a.name||a.short_name||"").localeCompare(String(b.name||b.short_name||"")));
 competitions.sort((a,b)=>competitionName(a).localeCompare(competitionName(b)));
 news.sort((a,b)=>new Date(b.created_at||b.published_at||0)-new Date(a.created_at||a.published_at||0));
 eventsLoadedAll=false;for(const m of matches){const ev=eventCache.get(String(m.id));if(ev)m.events=ev.slice();}
 dbOnline=jobs[0].status==="fulfilled"&&jobs[2].status==="fulfilled";

 /* Never destroy an active lineup draft during refresh. */
 if(lineupDraft.matchId){
  const fresh=matches.find(x=>String(x.id)===String(lineupDraft.matchId));
  if(!fresh)resetLineupDraft(null);
 }
 notifyFavoriteChanges(previousMatches);
 renderAll();
}
async function loadAllEvents(){
 if(!matches.length)return true;
 try{
  /* Never use loadTable() here: its generic fallback can turn an events
     query failure into [] and make a refresh look like all events vanished. */
  const data=await safeLoad(EVENTS_URL,{select:"*",order:"minute.asc,created_at.asc"});
  if(!Array.isArray(data))throw new Error("Supabase returned an invalid matches-events response");
  for(const m of matches)m.events=data.filter(e=>String(e.match_id)===String(m.id));
  return true;
 }catch(e){
  console.error("CupWorks matches-events load failed:",e);
  /* Preserve already-known events if the network/RLS temporarily fails.
     Do not replace them with an empty array. */
  for(const m of matches)if(!Array.isArray(m.events))m.events=[];
  dbOnline=false;
  showToast("Could not load match events: "+(e?.message||"database error"));
  return false;
 }
}

/* ---------- RENDER ---------- */
function showPage(id,button=null){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 const p=document.getElementById(id);if(p)p.classList.add("active");
 document.querySelectorAll("#nav button").forEach(b=>b.classList.remove("active"));
 if(button)button.classList.add("active");
 window.scrollTo({top:0,behavior:"auto"});
 const fn={home:renderHome,scores:renderScores,news:renderNews,competitions:renderCompetitions,stats:renderStats,search:renderSearch,admin:renderAdmin}[id];
 if(fn)fn();
 if(id==='match-page'&&selectedMatchId)renderMatch();
}
function navFor(page){const b=document.querySelector('#nav button[data-page="'+page+'"]');showPage(page,b)}

let renderQueued=false,rendering=false;
function activePageId(){return document.querySelector('.page.active')?.id||'home'}
function renderCurrentPage(){
 const id=activePageId();
 const fn={home:renderHome,scores:renderScores,news:renderNews,competitions:renderCompetitions,stats:renderStats,search:renderSearch,admin:renderAdmin}[id];
 if(fn)fn();
 if(selectedMatchId&&id==='match-page')renderMatch();
 renderTicker();
}
function renderAll(){
 if(rendering)return;
 rendering=true;
 try{renderCurrentPage()}finally{rendering=false}
}
function scheduleRender(){
 if(renderQueued)return;
 renderQueued=true;
 requestAnimationFrame(()=>{renderQueued=false;renderAll()});
}
function renderTicker(){
 const live=matches.filter(isLive),finished=matches.filter(isFinished).slice(-4);
 const items=[
  ...live.map(m=>`<b>LIVE</b> ${esc(teamDisplayName(m,"home"))} ${scoreOf(m)[0]}–${scoreOf(m)[1]} ${esc(teamDisplayName(m,"away"))}`),
  ...finished.map(m=>`${esc(teamDisplayName(m,"home"))} ${scoreOf(m)[0]}–${scoreOf(m)[1]} ${esc(teamDisplayName(m,"away"))}`)
 ];
 document.getElementById("tickerTrack").innerHTML=items.length?items.join(" &nbsp; • &nbsp; "):"CupWorks • No live matches right now • Follow the latest fixtures and results";
}
function favoriteIds(){try{return JSON.parse(localStorage.getItem("ramadoncup_favorite_matches")||"[]").map(String)}catch{return[]}}
function isFavorite(id){return favoriteIds().includes(String(id))}
function setFavorite(id,enabled){const set=new Set(favoriteIds());if(enabled)set.add(String(id));else set.delete(String(id));try{localStorage.setItem("ramadoncup_favorite_matches",JSON.stringify([...set]))}catch{}return enabled}
async function toggleFavorite(id){
 const next=!isFavorite(id);
 setFavorite(id,next);
 renderAll();
 showToast(next?"Match added to Favorites":"Match removed from Favorites");
 if(next&&typeof Notification!=="undefined"&&Notification.permission!=="granted")showToast("Enable notifications to receive favorite-match alerts");
}
function favoriteButton(m){const fav=isFavorite(m.id);return `<button class="btn small favorite-btn ${fav?"active":""}" title="${fav?"Remove from favorites":"Follow this match"}" aria-label="${fav?"Remove from favorites":"Follow this match"}" onclick="event.stopPropagation();toggleFavorite('${esc(m.id)}')">${fav?"★":"☆"}</button>`}
function matchCard(m){
 const[a,b]=scoreOf(m),live=isLive(m),ht=teamById(m.home_team_id),at=teamById(m.away_team_id);
 return `<article class="card match-card ${live?"live":""}">
  <div class="match-top"><span class="competition-label">${esc(competitionNameForMatch(m))}</span><div class="actions"><span class="status">${live?'● LIVE':isFinished(m)?"FT":fmtTime(matchTime(m))}</span>${favoriteButton(m)}</div></div>
  <div class="teams">

  const key=String(id??name);
  if(!table.has(key))table.set(key,{id,name:name||"Unknown",flag:flag||"",p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0});

/* ---------- STATUS / DATABASE FIX ---------- */
async function updateMatch(id,changes){
 const m=matches.find(x=>String(x.id)===String(id));
 if(!m)return false;
 const previous={...m,metadata:readMatchMetadata(m)};
 const requested={...changes};

 /* NEVER allow an ordinary edit to change match status. */
 delete requested.status;
 /* Never accidentally write undefined values from a half-rendered form. */
 for(const key of Object.keys(requested))if(requested[key]===undefined)delete requested[key];
 /* Scores are ALWAYS stored in the canonical Supabase columns score_home/score_away. */
 for(const key of ["score_home","score_away","minute","stoppage"])if(Object.prototype.hasOwnProperty.call(requested,key))requested[key]=Math.max(0,Math.floor(Number(requested[key])||0));

 const hasScoreWrite=Object.prototype.hasOwnProperty.call(requested,"score_home")||Object.prototype.hasOwnProperty.call(requested,"score_away");
 const expectedScore=hasScoreWrite?[
  Object.prototype.hasOwnProperty.call(requested,"score_home")?requested.score_home:Number(m.score_home||0),
  Object.prototype.hasOwnProperty.call(requested,"score_away")?requested.score_away:Number(m.score_away||0)
 ]:null;
 const key=String(id);
 if(hasScoreWrite){
  pendingMatchWrites.set(key,{score:expectedScore,startedAt:Date.now()});
  verifiedScoreCache.set(key,expectedScore.slice());
 }

 try{
  await supabaseFetch(
   MATCHES_URL+"?id=eq."+encodeURIComponent(id),
   {method:"PATCH",body:JSON.stringify(requested),headers:{Prefer:"return=representation"}}
  );

  /* Critical protection: immediately read the row back and verify the score.
     A successful HTTP PATCH alone is not enough; this catches schema/triggers/RLS
     problems before a later refresh can make a saved score appear as 0-0. */
  if(hasScoreWrite){
   let verified=null;
   for(let attempt=0;attempt<2;attempt++){
    try{
     const rows=await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(id)+"&select=id,score_home,score_away,status,minute,stoppage");
     verified=Array.isArray(rows)?rows[0]:rows;
    }catch(readErr){
     if(attempt===1)throw readErr;
    }
    if(verified&&Number(verified.score_home??0)===expectedScore[0]&&Number(verified.score_away??0)===expectedScore[1])break;
    if(attempt===0){
     await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({score_home:expectedScore[0],score_away:expectedScore[1]}),headers:{Prefer:"return=minimal"}});
    }
   }
   if(!verified||Number(verified.score_home??0)!==expectedScore[0]||Number(verified.score_away??0)!==expectedScore[1]){
    throw new Error(`Score verification failed: database returned ${Number(verified?.score_home??0)}-${Number(verified?.score_away??0)} instead of ${expectedScore[0]}-${expectedScore[1]}`);
   }
  }
 }catch(e){
  pendingMatchWrites.delete(key);
  verifiedScoreCache.delete(key);
  Object.assign(m,previous);
  console.error("CupWorks database update failed:",e);
  showToast("Could not save: "+(e?.message||"database error"));
  return false;
 }

 /* The database write and, for scores, the read-back verification succeeded. */
 Object.assign(m,requested);
 if(hasScoreWrite)pendingMatchWrites.delete(key);
 addLog(`Updated ${teamDisplayName(m,"home")} vs ${teamDisplayName(m,"away")}: ${Object.keys(changes).join(", ")}`);

 try{renderAll()}catch(uiError){console.error("CupWorks render after save failed:",uiError)}
 return true;
}

async function persistStatus(id,status){
 const m=matches.find(x=>String(x.id)===String(id));
 if(!m)return false;
 status=String(status).toLowerCase();
 const allowed=["scheduled","live","halftime","finished","postponed","cancelled","abandoned"];
 if(!allowed.includes(status)){showToast("Invalid match status");return false}
 const current=String(m.status||"").toLowerCase();
 if(current==="finished"&&status!=="finished"){showToast("A finished match cannot be reset from here");return false}
 const key=String(id),previousStatus=current||"scheduled";
 pendingStatusWrites.set(key,{status,startedAt:Date.now()});
 try{
  showToast(status==="live"?"Starting match…":status==="finished"?"Finishing match…":"Updating match…");
  await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status}),headers:{Prefer:"return=minimal"}});
  let verified=null;
  for(let attempt=0;attempt<3;attempt++){
   const rows=await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(id)+"&select=id,status,score_home,score_away,minute,stoppage");
   verified=Array.isArray(rows)?rows[0]:rows;
   if(verified&&String(verified.status||"").toLowerCase()===status)break;
   if(attempt<2)await new Promise(r=>setTimeout(r,150*(attempt+1)));
  }
  if(!verified||String(verified.status||"").toLowerCase()!==status){
   throw new Error(`Status verification failed: database returned ${verified?.status||"empty"} instead of ${status}`);
  }
  Object.assign(m,verified,{status});
  pendingStatusWrites.delete(key);
  addLog(`Status changed to ${status}: ${teamDisplayName(m,"home")} vs ${teamDisplayName(m,"away")}`);
  try{renderAll()}catch(uiError){console.error("CupWorks status render failed:",uiError)}
  return true;
 }catch(e){
  pendingStatusWrites.delete(key);
  m.status=previousStatus;
  console.error("CupWorks status update:",e);
  showToast("Status was not saved: "+(e?.message||"database error"));
  return false;
 }
}

async function setLiveClockState(m,mode){
 if(!m)return false;
 const meta=readMatchMetadata(m);
 const currentMinute=Math.max(0,Math.floor(liveMinute(m)));
 if(mode==="start"){
  meta.clock={started_at:new Date().toISOString(),base_minute:currentMinute,base_stoppage:Number(m.stoppage||0)};
 }else{
  delete meta.clock;
 }
 const ok=await updateMatch(m.id,{minute:currentMinute,metadata:meta});
 if(ok){m.minute=currentMinute;m.metadata=meta;}
 return ok;
}

function liveMinute(m){
 if(!m)return 0;
 const base=Math.max(0,Math.floor(Number(m.minute)||0));
 const clock=readMatchMetadata(m).clock;
 if(!isLive(m)||!clock?.started_at)return base;
 const started=Date.parse(clock.started_at);
 if(!Number.isFinite(started))return base;
 const elapsed=Math.max(0,Date.now()-started);
 return base+Math.floor(elapsed/60000);
}

function liveDisplayMinute(m){
 const minute=liveMinute(m);
 return `${minute}${Number(m?.stoppage||0)>0?`+${Math.floor(Number(m.stoppage)||0)}`:""}'`;
}

async function startSelected(){
 const id=selectedMatchId;if(!id)return;
 const m=matches.find(x=>String(x.id)===String(id));if(!m)return;
 if(isFinished(m)){showToast("This match is already finished");return}
 const ok=await persistStatus(id,"live");if(!ok)return;
 const clockOk=await setLiveClockState(m,"start");
 if(!clockOk){await persistStatus(id,String(m.status||"scheduled"));showToast("Match started, but the clock could not be initialized");return}
 m.status="live";startTimer();renderMatch();renderAdminPanel();showToast("Match is LIVE");
}

async function pauseSelected(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;
 const current=Math.max(0,Math.floor(liveMinute(m)));
 m.minute=current;
 const ok=await persistStatus(selectedMatchId,"halftime");
 if(!ok)return;
 stopTimer();
 const meta=readMatchMetadata(m);delete meta.clock;
 await updateMatch(m.id,{minute:current,metadata:meta});
 m.minute=current;m.metadata=meta;m.status="halftime";
 renderMatch();renderAdminPanel();showToast(`Half time • ${current}'`);
}

async function syncPlayerTotalsFromEvents(){
 const stats=eventStats();
 const jobs=[];
 for(const [id,row] of stats){
  const p=playerById(id);
  if(!p||id==null)continue;
  /* Only reconcile players that actually have event/lineup records. This preserves
     legacy database totals for players from seasons that have no event history. */
  const body={goals:Number(row.goals||0),assists:Number(row.assists||0),yellow_cards:Number(row.yellow_cards||0),red_cards:Number(row.red_cards||0)};
  jobs.push(supabaseFetch(PLAYERS_URL+"?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify(body),headers:{Prefer:"return=minimal"}}).then(()=>{Object.assign(p,body)}));
 }
 const results=await Promise.allSettled(jobs);
 const failed=results.filter(r=>r.status==='rejected');
 if(failed.length)throw new Error(`${failed.length} player statistic update${failed.length===1?'':'s'} failed`);
 return true;
}
async function syncCompletedMatchStats(match){
 if(!match)return false;
 try{
  /* Completion is a database checkpoint, not a second chance to increment
     player totals. Goals/cards/assists are already stored as events when they
     happen, and Stats derives its numbers from those events. Re-reading the
     finished match here guarantees the completion flow uses the database copy. */
  const events=await safeLoad(EVENTS_URL,{select:"*",match_id:"eq."+encodeURIComponent(match.id),order:"minute.asc,created_at.asc"});
  if(!Array.isArray(events))throw new Error("Invalid matches-events response");
  const metadata=readMatchMetadata(match);
  metadata.stats_synced_at=new Date().toISOString();
  metadata.stats_event_count=events.length;
  await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(match.id),{method:"PATCH",body:JSON.stringify({metadata}),headers:{Prefer:"return=minimal"}});
  match.events=events;
  /* Reconcile player totals after the final whistle. This makes the players table
     agree with the actual event stream, including goals that were recorded before
     this browser session existed. */
  await syncPlayerTotalsFromEvents();
  match.metadata=metadata;
  match.events=events;
  return true;
 }catch(e){
  console.error("CupWorks completed-match event sync failed:",e);
  showToast("Match finished, but event sync failed: "+(e?.message||"database error"));
  return false;
 }
}
async function finishSelected(){const m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;const he=document.getElementById('admHomeScore'),ae=document.getElementById('admAwayScore'),me=document.getElementById('admMinute'),se=document.getElementById('admStoppage');const homeScore=he?Math.max(0,Math.floor(Number(he.value)||0)):Math.max(0,Math.floor(Number(m.score_home)||0)),awayScore=ae?Math.max(0,Math.floor(Number(ae.value)||0)):Math.max(0,Math.floor(Number(m.score_away)||0)),minute=me?Math.max(0,Math.floor(Number(me.value)||0)):Math.max(0,Math.floor(isLive(m)?liveMinute(m):Number(m.minute)||0)),stoppage=se?Math.max(0,Math.floor(Number(se.value)||0)):Math.max(0,Math.floor(Number(m.stoppage)||0));showToast('Saving final score…');if(!await updateMatch(m.id,{score_home:homeScore,score_away:awayScore,minute,stoppage})){showToast('Match was not finished because the final score could not be saved.');return}if(!await persistStatus(m.id,'finished'))return;stopTimer();m.score_home=homeScore;m.score_away=awayScore;m.minute=minute;m.stoppage=stoppage;m.status='finished';delete readMatchMetadata(m).clock;showToast('Match finished — syncing events and stats…');await syncCompletedMatchStats(m);await loadData();const fresh=matches.find(x=>String(x.id)===String(m.id));if(fresh&&isFinished(fresh))showToast(`Final saved: ${scoreOf(fresh)[0]}–${scoreOf(fresh)[1]} • FULL TIME`);else if(fresh)showToast('Score saved, but status verification failed — check Supabase.');}


/* ---------- CLOCK: NEVER REBUILD DIRTY LINEUP EDITOR ---------- */
function startTimer(){
 stopTimer();
 const tick=async()=>{
  const m=matches.find(x=>String(x.id)===String(selectedMatchId));
  if(!m||!isLive(m))return;
  const minute=Math.max(0,Math.floor(liveMinute(m)));
  const previous=Number(m.minute||0);
  if(minute!==previous){
   m.minute=minute;
   try{
    await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(m.id),{method:"PATCH",body:JSON.stringify({minute,status:"live"}),headers:{Prefer:"return=minimal"}});
   }catch(e){console.warn("CupWorks clock persistence failed:",e)}
  }
  const min=document.getElementById("admMinute");if(min&&!document.activeElement?.matches?.("#admMinute"))min.value=minute;
  const em=document.getElementById("eventMinute");if(em&&!document.activeElement?.matches?.("#eventMinute"))em.value=minute;
  const om=document.getElementById("otherEventMinute");if(om&&!document.activeElement?.matches?.("#otherEventMinute"))om.value=minute;
  renderTicker();
  if(selectedMatchId)renderMatch();
 };
 tick();
 timer=setInterval(tick,1000);
}
function stopTimer(){if(timer)clearInterval(timer);timer=null}
function resumeLiveTimer(){const live=matches.find(m=>String(m.id)===String(selectedMatchId)&&isLive(m));if(live)startTimer()}

/* ---------- EVENTS ---------- */
async function postEvent(event){
 const payload={...event,data:event.data&&typeof event.data==="object"?event.data:{}};
 if(payload.match_id!=null)payload.match_id=Number(payload.match_id);
 if(payload.team_id!=null)payload.team_id=Number(payload.team_id);
 if(payload.player_id!=null)payload.player_id=Number(payload.player_id);
 if(payload.player_out_id!=null)payload.player_out_id=Number(payload.player_out_id);
 if(!Number.isInteger(payload.match_id))throw new Error("Invalid match_id for event");
 if(payload.team_id!=null&&!Number.isInteger(payload.team_id))throw new Error("Invalid team_id for event");
 if(payload.player_id!=null&&!Number.isInteger(payload.player_id))throw new Error("Invalid player_id for event");
 const result=await supabaseFetch(EVENTS_URL,{method:"POST",body:JSON.stringify(payload)});
 const row=Array.isArray(result)?result[0]:result;
 if(!row||row.id==null)throw new Error("Event INSERT returned no row. Check matches-events INSERT/SELECT policies.");
 return row;
}
async function deleteEventRow(id){
 if(!id)throw new Error("Event has no database id");
 await supabaseFetch(EVENTS_URL+"?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}});
}
async function adjustPlayerStat(playerId,field,delta){
 if(!playerId||!["goals","assists","yellow_cards","red_cards"].includes(field))return false;
 const p=playerById(playerId);
 if(!p)throw new Error(`Player ${playerId} is not loaded`);
 const current=Number(p[field]||0);
 const value=Math.max(0,current+Number(delta||0));
 await supabaseFetch(PLAYERS_URL+"?id=eq."+encodeURIComponent(playerId),{method:"PATCH",body:JSON.stringify({[field]:value}),headers:{Prefer:"return=minimal"}});
 p[field]=value;
 return true;
}

function refreshOtherEventPlayers(){const teamId=document.getElementById("otherEventTeam")?.value,sel=document.getElementById("otherEventPlayer");if(!sel)return;const ps=players.filter(p=>String(p.team_id)===String(teamId));sel.innerHTML='<option value="">No player</option>'+ps.map(p=>`<option value="${esc(p.id)}">${esc(p.short_name||p.name)}</option>`).join("")}
async function addGoalWithAssist(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));
 if(!m)return;
 if(addGoalWithAssist.busy){showToast("A goal is already being saved");return}
 addGoalWithAssist.busy=true;
 const teamIdRaw=document.getElementById("eventTeamSelect")?.value;
 const playerIdRaw=document.getElementById("eventPlayerSelect")?.value||null;
 const assistIdRaw=document.getElementById("eventAssistPlayerSelect")?.value||null;
 const minute=Math.max(0,Number(document.getElementById("eventMinute")?.value)||Number(m.minute)||0);
 const stoppage=Math.max(0,Number(document.getElementById("eventStoppage")?.value)||0);
 const teamId=Number(teamIdRaw),playerId=Number(playerIdRaw),assistId=assistIdRaw?Number(assistIdRaw):null,matchId=Number(m.id);
 if(!Number.isInteger(teamId)||!Number.isInteger(playerId)||!Number.isInteger(matchId)){showToast("Invalid match, team or player ID");addGoalWithAssist.busy=false;return}
 if(assistId!=null&&!Number.isInteger(assistId)){showToast("Invalid assist player ID");addGoalWithAssist.busy=false;return}
 if(!teamId||!playerId){showToast("Select the scoring team and scorer");addGoalWithAssist.busy=false;return}
 if(assistId&&assistId===playerId){showToast("Scorer and assister must be different");addGoalWithAssist.busy=false;return}
 const isHome=teamId===Number(m.home_team_id),isAway=teamId===Number(m.away_team_id);
 if(!isHome&&!isAway){showToast("Scoring team is not part of this match");addGoalWithAssist.busy=false;return}
 const p=playerById(playerId),ap=playerById(assistId);
 if(!p){showToast(`Player ${playerId} is not loaded in CupWorks`);addGoalWithAssist.busy=false;return}
 if(String(p.team_id)!==String(teamId)){showToast("The scorer is not assigned to the selected team");addGoalWithAssist.busy=false;return}
 if(assistId&&(!ap||String(ap.team_id)!==String(teamId))){showToast("The assister is not assigned to the selected team");addGoalWithAssist.busy=false;return}

 const oldHome=Number(m.score_home||0),oldAway=Number(m.score_away||0);
 const newScoreHome=isHome?oldHome+1:oldHome,newScoreAway=isAway?oldAway+1:oldAway;
 const created=[];
 let scoreSaved=false,goalStat=false,assistStat=false;
 const goalEvent={match_id:matchId,minute,stoppage,type:"goal",player_id:playerId,team_id:teamId,player:p.name||p.short_name||"",team:teamName(teamId,""),detail:assistId?`Assist: ${ap?.name||ap?.short_name||""}`:"",data:{}};
 const assistEvent=assistId?{match_id:matchId,minute,stoppage,type:"assist",player_id:assistId,team_id:teamId,player:ap.name||ap.short_name||"",team:teamName(teamId,""),detail:`For ${p.name||p.short_name||""}`,data:{}}:null;
 try{
  showToast("Saving goal…");

  /* 1. Save the new score to the database first. */
  const scoreOK=await updateMatch(m.id,{score_home:newScoreHome,score_away:newScoreAway});
  if(!scoreOK)throw new Error("Score could not be saved");
  scoreSaved=true;

  /* 2. Save the actual goal event. The event is now mandatory for success. */
  const goal=await postEvent(goalEvent);
  created.push(goal);
  await adjustPlayerStat(playerId,"goals",1);
  goalStat=true;

  /* 3. If an assist was selected, save it as its own event. */
  if(assistEvent){
   const assist=await postEvent(assistEvent);
   created.push(assist);
   await adjustPlayerStat(assistId,"assists",1);
   assistStat=true;
  }

  /* Local state is updated only after every database step succeeds. */
  m.events=m.events||[];
  created.forEach(e=>m.events.push(e));
  try{renderAll()}catch(uiError){console.error("CupWorks goal render failed:",uiError)}
  showToast(assistId?"Goal + assist saved":"Goal saved");
 }catch(e){
  console.error("CupWorks goal transaction failed:",e);

  /* Roll back every part that succeeded. This prevents score-only ghosts. */
  for(const ev of created.slice().reverse()){
   try{await deleteEventRow(ev.id)}catch(re){console.error("Goal rollback event failed:",re)}
  }
  if(assistStat){try{await adjustPlayerStat(assistId,"assists",-1)}catch(re){console.error("Assist stat rollback failed:",re)}}
  if(goalStat){try{await adjustPlayerStat(playerId,"goals",-1)}catch(re){console.error("Goal stat rollback failed:",re)}}
  if(scoreSaved){
   try{
    await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(m.id),{method:"PATCH",body:JSON.stringify({score_home:oldHome,score_away:oldAway}),headers:{Prefer:"return=minimal"}});
    m.score_home=oldHome;m.score_away=oldAway;
   }catch(re){console.error("Score rollback failed:",re)}
  }
  try{await loadMatchEvents(selectedMatchId,true);renderAll()}catch(uiError){console.error("CupWorks rollback render failed:",uiError)}
  const detail=[e?.message,e?.code?`code ${e.code}`:"",e?.hint?`hint: ${e.hint}`:""].filter(Boolean).join(" — ");
  showToast("Goal NOT saved: "+(detail||"database error"));
 }finally{
  addGoalWithAssist.busy=false;
 }
}

function setupRealtime(){
 if(!window.supabase?.createClient||realtimeChannels.length)return;
 try{
  realtimeClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const eventsChannel=realtimeClient.channel("cupworks-events").on("postgres_changes",{event:"INSERT",schema:"public",table:"ramadoncup_matches_events"},payload=>{
   const e=payload.new,m=matches.find(x=>String(x.id)===String(e?.match_id));
   if(!m)return;
   m.events=m.events||[];if(!m.events.some(x=>String(x.id)===String(e.id)))m.events.push(e);eventCache.set(String(m.id),m.events.slice());try{cacheData()}catch{}
   notifyFavoriteEvent(m,e);
   try{scheduleRender()}catch(err){console.error("CupWorks realtime render:",err)}
  }).subscribe();
  const matchesChannel=realtimeClient.channel("cupworks-matches").on("postgres_changes",{event:"UPDATE",schema:"public",table:"ramadoncup_matches"},payload=>{
   const incoming=payload.new,old=payload.old||{},m=matches.find(x=>String(x.id)===String(incoming?.id));
   if(!m)return;
   const pendingStatus=pendingStatusWrites.get(String(incoming?.id));
   if(pendingStatus&&String(incoming?.status||"").toLowerCase()!==String(pendingStatus.status).toLowerCase()){
    console.warn("CupWorks ignored stale realtime status",incoming?.id,incoming?.status,"expected",pendingStatus.status);
    return;
   }
   const fav=isFavorite(m.id);
   const key=String(m.id);
   const oldScore=Number(m.score_home||0)+"-"+Number(m.score_away||0);
   const incomingScore=[Number(incoming.score_home??0),Number(incoming.score_away??0)];
   const pending=pendingMatchWrites.get(key);
   const pendingMatchesIncoming=!!pending&&incomingScore[0]===pending.score[0]&&incomingScore[1]===pending.score[1];
   /* Realtime is advisory, not authoritative during an in-flight score write.
      Never let a stale 0-0 payload overwrite a freshly verified score. */
   if(pending&&!pendingMatchesIncoming){
    const safeIncoming={...incoming};
    delete safeIncoming.score_home;delete safeIncoming.score_away;
    Object.assign(m,safeIncoming);
   }else{
    Object.assign(m,incoming);
    if(pendingMatchesIncoming){pendingMatchWrites.delete(key);verifiedScoreCache.set(key,incomingScore.slice());}
   }
   const newScore=Number(m.score_home||0)+"-"+Number(m.score_away||0);
   const scoreChanged=oldScore!==newScore,statusChanged=String(m.status||"")!==String(incoming.status||"");
   if(fav&&typeof Notification!=="undefined"&&Notification.permission==="granted"&&scoreChanged){
    try{new Notification("CupWorks Score Update",{body:`${teamDisplayName(m,"home")} ${newScore.replace("-","–")} ${teamDisplayName(m,"away")}`,tag:`mefco-score-${m.id}-${newScore}`})}catch{}
   }
   if(fav&&typeof Notification!=="undefined"&&Notification.permission==="granted"&&statusChanged&&isFinished(m)){
    try{new Notification("CupWorks Full Time",{body:`${teamDisplayName(m,"home")} ${newScore.replace("-","–")} ${teamDisplayName(m,"away")}`,tag:`mefco-ft-${m.id}`})}catch{}
   }
   try{renderAll()}catch(err){console.error("CupWorks realtime match render:",err)}
  }).subscribe();
  realtimeChannels=[eventsChannel,matchesChannel];
 }catch(e){console.warn("CupWorks realtime unavailable:",e)}
}

async function loadMatchEvents(matchId,force=false){
 const key=String(matchId||'');if(!key)return false;
 if(!force&&eventCache.has(key)){const m=matches.find(x=>String(x.id)===key);if(m)m.events=(eventCache.get(key)||[]).slice();return true;}
 if(eventLoading.has(key))return eventLoading.get(key);
 const task=(async()=>{try{
  const data=await safeLoad(EVENTS_URL,{select:'*',match_id:'eq.'+key,order:'minute.asc,created_at.asc'});if(!Array.isArray(data))throw new Error('Invalid matches-events response');
  eventCache.set(key,data.slice());const m=matches.find(x=>String(x.id)===key);if(m)m.events=data.slice();try{cacheData()}catch{}return true;
 }catch(e){console.error('CupWorks match events load failed:',e);const m=matches.find(x=>String(x.id)===key);if(m&&!Array.isArray(m.events))m.events=[];showToast('Could not load match events: '+(e?.message||'database error'));return false;}finally{eventLoading.delete(key)}})();
 eventLoading.set(key,task);return task;
}
async function loadEventsForMatchIds(ids){
 const unique=[...new Set((ids||[]).map(String).filter(Boolean))];if(!unique.length)return true;
 try{
  const data=await safeLoad(EVENTS_URL,{select:'*',match_id:'in.('+unique.join(',')+')',order:'minute.asc,created_at.asc'});if(!Array.isArray(data))throw new Error('Invalid matches-events response');
  const grouped=new Map(unique.map(id=>[id,[]]));for(const e of data){const k=String(e.match_id);if(grouped.has(k))grouped.get(k).push(e)}
  for(const [id,evs] of grouped){eventCache.set(id,evs);const m=matches.find(x=>String(x.id)===id);if(m)m.events=evs.slice();}try{cacheData()}catch{}return true;
 }catch(e){console.error('CupWorks bulk event load failed:',e);showToast('Could not load match statistics: '+(e?.message||'database error'));return false;}
}
async function loadAllEvents(){if(eventsLoadedAll)return true;const ok=await loadEventsForMatchIds(matches.map(m=>m.id));if(ok)eventsLoadedAll=true;return ok;}

function lineupPositionGroup(p){
 const x=String(p?.position||p?.position_group||p?.role||'').toLowerCase();
 if(/gk|goalkeeper|keeper/.test(x))return 'gk';
 if(/cb|centre.?back|center.?back|defen|full.?back|wing.?back|lb|rb|lwb|rwb|back/.test(x))return 'def';

function playerRating(p){return Number(p?.overall??p?.ovr??p?.rating??p?.overall_rating??0)||0}
function autoSelectXI(teamId){

 if(pool.length<=11)return pool.slice().sort((a,b)=>playerRating(b)-playerRating(a)).map(p=>String(p.id));
 const groups={gk:[],def:[],mid:[],fwd:[],other:[]};
 pool.forEach(p=>groups[lineupPositionGroup(p)].push(p));
 Object.values(groups).forEach(a=>a.sort((x,y)=>playerRating(y)-playerRating(x)));
 const selected=[];
 const take=(group,n)=>{for(const p of group){if(selected.length>=11||n<=0)break;if(!selected.includes(String(p.id))){selected.push(String(p.id));n--;}}};

}

<script>

window.CupWorks_V9={version:'9.0',loadedAt:new Date().toISOString()};

/* Database authority: status and score writes are verified and stale realtime payloads are ignored. */
const _v9UpdateMatch=updateMatch;
updateMatch=async function(id,changes){
 const result=await _v9UpdateMatch(id,changes);
 if(!result)return false;
 const m=matches.find(x=>String(x.id)===String(id));
 if(!m)return true;
 try{
  const rows=await supabaseFetch(MATCHES_URL+'?id=eq.'+encodeURIComponent(id)+'&select=*');
  const db=Array.isArray(rows)?rows[0]:rows;
  if(!db)return false;
  const scoreFields=['score_home','score_away'];
  for(const f of scoreFields)if(Object.prototype.hasOwnProperty.call(changes,f)&&Number(db[f]??0)!==Number(changes[f]??0))throw new Error('Verified database score mismatch');
  if(Object.prototype.hasOwnProperty.call(changes,'metadata'))m.metadata=db.metadata;
  return true;
 }catch(e){console.error('V9 database verification:',e);return false}
};

/* Prevent stale realtime status/score payloads after a verified write. */

};

function v9Upcoming(){return matches.filter(m=>!isFinished(m)&&!isLive(m)&&!String(m.status||'').toLowerCase().includes('cancel')).sort((a,b)=>(matchDate(a)+matchTime(a)).localeCompare(matchDate(b)+matchTime(b)))}
function v9Recent(){return v9Finished().slice().sort((a,b)=>(matchDate(b)+matchTime(b)).localeCompare(matchDate(a)+matchTime(a)))}
function v9ResultLetter(m,t){const[h,a]=scoreOf(m),home=String(m.home_team_id)===String(t);return home?(h>a?'W':h<a?'L':'D'):(a>h?'W':a<h?'L':'D')}
function v9Form(t){return matches.filter(m=>(String(m.home_team_id)===String(t)||String(m.away_team_id)===String(t))&&isFinished(m)).sort((a,b)=>(matchDate(b)+matchTime(b)).localeCompare(matchDate(a)+matchTime(a))).slice(0,5).map(m=>v9ResultLetter(m,t))}

function renderV9Dashboard(){

 const leader=table[0];
 document.getElementById('home').insertAdjacentHTML('beforeend',`
 <div class="section"><div class="section-head"><div><div class="eyebrow">Matchday dashboard</div><h2>CupWorks Today</h2><p>Live football, upcoming fixtures and the latest completed results.</p></div><button class="btn" onclick="runV9Health()">System health</button></div>

 ${favMatches.length?`<div class="section"><div class="section-head"><div><div class="eyebrow">Following</div><h2>Your followed matches</h2></div></div><div class="grid">${favMatches.map(matchCard).join('')}</div></div>`:''}`);

 const ms=v9FilteredMatches(),ps=[];
 for(const p of players){const copy={...p};const ev=ms.flatMap(m=>(m.events||[]).filter(e=>String(e.player_id)===String(p.id)));copy.goals=ev.filter(e=>eventType(e)==='goal').length;copy.assists=ev.filter(e=>eventType(e)==='assist').length;copy.yellow_cards=ev.filter(e=>eventType(e)==='yellow').length;copy.red_cards=ev.filter(e=>eventType(e)==='red').length;copy.appearances=ms.filter(m=>{const meta=readMatchMetadata(m),line=meta.lineups||{};return [...(line.home||[]),...(line.away||[])].map(String).includes(String(p.id))||ev.some(e=>String(e.match_id||m.id)===String(m.id))}).length;copy.team=teamName(p.team_id,p.nationality||'');ps.push(copy)}
 const totalGoals=ps.reduce((n,p)=>n+p.goals,0),totalAssists=ps.reduce((n,p)=>n+p.assists,0),y=ps.reduce((n,p)=>n+p.yellow_cards,0),r=ps.reduce((n,p)=>n+p.red_cards,0),comps=getCompetitionList();
 document.getElementById('stats').innerHTML=`<div class="section-head"><div><div class="eyebrow">Statistics centre</div><h2>CupWorks stats</h2><p>Event- and lineup-backed totals from the selected competition.</p></div><button class="btn" onclick="refreshData()">↻ Refresh</button></div><div class="v9-filterbar"><select class="select v9-stat-filter" onchange="v9SetStatsCompetition(this.value)"><option value="all">All competitions</option>${comps.map(c=>`<option value="${esc(c.id||c.name)}" ${String(window.v9StatsFilter.competition)===String(c.id||c.name)?'selected':''}>${esc(c.name)}${c.season?' • '+esc(c.season):''}</option>`).join('')}</select></div><div class="kpis"><div class="kpi"><strong>${totalGoals}</strong><span>Goals</span></div><div class="kpi"><strong>${totalAssists}</strong><span>Assists</span></div><div class="kpi"><strong>${y}</strong><span>Yellow cards</span></div><div class="kpi"><strong>${r}</strong><span>Red cards</span></div></div><div class="stats-grid section">${statTable('Top scorers',ps,'goals','Goals')}${statTable('Assist leaders',ps,'assists','Assists')}${statTable('Most appearances',ps,'appearances','Appearances')}</div><div class="stats-grid section">${statTable('Yellow cards',ps,'yellow_cards','Yellow cards')}${statTable('Red cards',ps,'red_cards','Red cards')}<div class="card stat-leader-card"><div class="eyebrow">Teams</div><h3>Table</h3>${renderLeagueTable(ms)}</div></div>`;

openCompetition=function(id,name){
 selectedCompetition={id,name};const ms=competitionMatches(id,name),c=competitions.find(x=>String(x.id)===String(id));
 const finished=ms.filter(isFinished),table=buildLeagueTable(ms),top=players.map(p=>{const ev=finished.flatMap(m=>(m.events||[]).filter(e=>String(e.player_id)===String(p.id)));return {...p,g:ev.filter(e=>eventType(e)==='goal').length,a:ev.filter(e=>eventType(e)==='assist').length}}).filter(p=>p.g||p.a).sort((a,b)=>b.g-a.g||b.a-a.a).slice(0,10);

 document.getElementById('competition-page').innerHTML=`<button class="ghost" onclick="navFor('competitions')">← Competitions</button><div class="card" style="margin-top:14px;padding:24px"><div class="eyebrow">Competition hub</div><h1>${esc(c?.name||name)}</h1><p class="muted">${esc(c?.description||'CupWorks competition')}</p><div class="kpis"><div class="kpi"><strong>${new Set(ms.flatMap(m=>[m.home_team_id,m.away_team_id].filter(Boolean))).size}</strong><span>Teams</span></div><div class="kpi"><strong>${ms.length}</strong><span>Matches</span></div><div class="kpi"><strong>${finished.length}</strong><span>Completed</span></div><div class="kpi"><strong>${ms.filter(isLive).length}</strong><span>Live</span></div></div></div><div class="v9-comp-tabs"><button class="active">Overview</button><button>Fixtures & Results</button><button>Table</button><button>Stats</button><button>News</button></div><div class="section">${renderLeagueTable(ms)}</div><div class="section"><div class="section-head"><div><h2>Fixtures & results</h2></div></div>${ms.length?`<div class="grid">${ms.map(matchCard).join('')}</div>`:'<div class="empty">No matches linked to this competition.</div>'}</div><div class="section"><div class="section-head"><div><h2>Competition leaders</h2></div></div>${top.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Team</th><th>Goals</th><th>Assists</th></tr></thead><tbody>${top.map(p=>`<tr><td><button class="ghost" onclick="openPlayer('${esc(p.id)}')">${esc(p.name)}</button></td><td>${esc(teamName(p.team_id,''))}</td><td><b>${p.g}</b></td><td>${p.a}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No event-backed player leaders yet.</div>'}</div><div class="section"><div class="section-head"><div><h2>Competition news</h2></div></div>${related.length?`<div class="grid">${related.map(newsCard).join('')}</div>`:'<div class="empty">No related news articles yet.</div>'}</div>`;showPage('competition-page');
};

/* Search: grouped results with useful metadata. */
function renderSearch(){document.getElementById('search').innerHTML=`<div class="section-head"><div><div class="eyebrow">Global search</div><h2>Search CupWorks</h2><p>Search teams, players, matches, competitions and news from one place.</p></div></div><div class="searchbox"><input id="globalSearch" class="input" placeholder="Search anything…" oninput="runSearch(this.value)"></div><div id="searchResults" class="search-results"></div>`}
runSearch=function(q){q=String(q||'').trim().toLowerCase();const el=document.getElementById('searchResults');if(!q){el.innerHTML='';return}const groups=[['Teams',teams.filter(t=>(t.name+' '+(t.short_name||'')+' '+(t.country||'')).toLowerCase().includes(q)).slice(0,6).map(t=>({name:t.name,sub:(t.country||'Team'),kind:'team',id:t.id}))],['Players',players.filter(p=>(p.name+' '+(p.short_name||'')+' '+(p.nationality||'')).toLowerCase().includes(q)).slice(0,8).map(p=>({name:p.name,sub:teamName(p.team_id,p.position||''),kind:'player',id:p.id}))],['Matches',matches.filter(m=>(teamDisplayName(m,'home')+' '+teamDisplayName(m,'away')+' '+(m.competition||'')).toLowerCase().includes(q)).slice(0,8).map(m=>({name:teamDisplayName(m,'home')+' '+scoreOf(m)[0]+'–'+scoreOf(m)[1]+' '+teamDisplayName(m,'away'),sub:(m.competition||'Match')+' • '+(m.status||'scheduled'),kind:'match',id:m.id}))],['Competitions',getCompetitionList().filter(c=>String(c.name).toLowerCase().includes(q)).slice(0,6).map(c=>({name:c.name,sub:c.season||'Competition',kind:'competition',id:c.id}))],['News',news.filter(n=>(String(n.title||'')+' '+newsText(n)).toLowerCase().includes(q)).slice(0,6).map(n=>({name:n.title,sub:formatNewsDate(n),kind:'news',id:n.id}))]].filter(g=>g[1].length);window._v9SearchResults=groups.flatMap(g=>g[1]);el.innerHTML=groups.length?groups.map(g=>`<div class="v9-search-group"><h3>${esc(g[0])}</h3>${g[1].map(x=>`<button class="v9-search-card" onclick="v9SearchOpen('${esc(x.kind)}','${esc(x.id)}')"><strong>${esc(x.name)}</strong><span class="muted">${esc(x.sub)}</span></button>`).join('')}</div>`).join(''):'<div class="empty">No results.</div>'};

/* Database health: read-only diagnostics for future bugs. */
async function runV9Health(){
 const checks=[['Matches',MATCHES_URL],['Events',EVENTS_URL],['Players',PLAYERS_URL],['Teams',TEAMS_URL],['Competitions',COMPETITIONS_URL],['News',NEWS_URL]];
 const out=[];for(const [name,url] of checks){try{const rows=await supabaseFetch(url+'?select=*&limit=1');out.push([name,true,Array.isArray(rows)?'reachable':'reachable'])}catch(e){out.push([name,false,String(e?.message||e).slice(0,80)])}}
 const finished=v9Finished(),live=v9Live(),scheduled=v9Upcoming();
 const issues=[];for(const m of matches){const st=String(m.status||'').toLowerCase();if(!['scheduled','live','halftime','finished','cancelled','postponed'].includes(st))issues.push('Unknown status: '+m.id);if(Number(m.score_home)<0||Number(m.score_away)<0)issues.push('Negative score: '+m.id)}
 const html=`<div class="card" style="padding:18px;margin-top:14px"><div class="section-head"><div><div class="eyebrow">Database health</div><h3>CupWorks system diagnostics</h3><p>Read-only checks against the current Supabase data.</p></div><button class="btn small" onclick="this.closest('.card').remove()">Close</button></div><div class="v9-health-grid">${out.map(x=>`<div class="v9-health-item"><strong class="${x[1]?'v9-ok':'v9-danger'}">${x[1]?'✓':'✕'} ${esc(x[0])}</strong><span class="muted">${esc(x[2])}</span></div>`).join('')}</div><div class="mini-grid" style="margin-top:12px"><div class="mini-stat"><strong>${finished.length}</strong><span>Finished</span></div><div class="mini-stat"><strong>${live.length}</strong><span>Live</span></div><div class="mini-stat"><strong>${scheduled.length}</strong><span>Upcoming</span></div><div class="mini-stat"><strong>${issues.length}</strong><span>Data warnings</span></div></div>${issues.length?`<div class="section"><div class="v9-note v9-warn">${issues.map(esc).join('<br>')}</div></div>`:'<div class="section v9-note v9-ok">No basic match integrity warnings detected.</div>'}</div>`;document.getElementById('home').insertAdjacentHTML('beforeend',html);window.scrollTo({top:document.getElementById('home').scrollHeight,behavior:'smooth'})}

/* Ensure home dashboard is rendered once after normal home rendering. */
const _v9RenderHomeBase=renderHome;

/* Automatic post-match consistency checkpoint. */
async function v9ConsistencySweep(){
 const finished=matches.filter(isFinished).slice(0,100);
 for(const m of finished){
  const key=String(m.id);
  if(pendingMatchWrites.has(key)||pendingStatusWrites.has(key))continue;
  const s=scoreOf(m);if(s.some(v=>!Number.isFinite(v)||v<0))console.warn('CupWorks invalid score',m.id,s);

(function(){
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const num=v=>Number.isFinite(Number(v))?Number(v):0;
  function featureTeamMatches(id){return matches.filter(m=>String(m.home_team_id)===String(id)||String(m.away_team_id)===String(id));}
  function featureFinishedTeamMatches(id){return featureTeamMatches(id).filter(isFinished).sort((a,b)=>(matchDate(b)+matchTime(b)).localeCompare(matchDate(a)+matchTime(a)));}
  function featureTeamForm(id){
    return featureFinishedTeamMatches(id).slice(0,5).map(m=>{
      const [h,a]=scoreOf(m),home=String(m.home_team_id)===String(id),gf=home?h:a,ga=home?a:h;
      return gf>ga?3:gf===ga?1:0;
    });
  }
  function featureTeamAverages(id){
    const ms=featureFinishedTeamMatches(id), recent=ms.slice(0,8);
    if(!recent.length)return {gf:1.25,ga:1.25,form:1.5};
    let gf=0,ga=0,form=0;
    recent.forEach(m=>{const [h,a]=scoreOf(m),home=String(m.home_team_id)===String(id);const f=home?h:a,ag=home?a:h;gf+=f;ga+=ag;form+=f>ag?3:f===ag?1:0});
    return {gf:gf/recent.length,ga:ga/recent.length,form:form/recent.length};
  }
  function featurePredict(m){
    const h=featureTeamAverages(m.home_team_id),a=featureTeamAverages(m.away_team_id);
    const homeEdge=.22;
    const attackH=h.gf/(a.ga+.65),attackA=a.gf/(h.ga+.65);
    const formH=h.form/3,formA=a.form/3;
    let home=attackH*.56+formH*.34+homeEdge;
    let away=attackA*.56+formA*.34;

  function renderPredictor(m){
    const p=featurePredict(m),home=teamDisplayName(m,'home'),away=teamDisplayName(m,'away'),done=isFinished(m)||isLive(m);
    if(done)return `<div class="card mi-panel"><div class="mi-head"><div><div class="eyebrow">Match Predictor</div><h3>Pre-match projection</h3></div><span class="muted">Available before kick-off</span></div><div class="mi-muted">The projection is hidden once the match is live or finished.</div></div>`;
    const hp=Math.round(p.home*100),dp=Math.round(p.draw*100),ap=Math.round(p.away*100);
    return `<div class="card mi-panel"><div class="mi-head"><div><div class="eyebrow">Match Predictor</div><h3>Pre-match projection</h3><p class="muted">Statistical estimate from recent results, scoring and defensive records.</p></div><span class="pill">Not a result</span></div><div class="predict-grid"><div><strong>${hp}%</strong><span>${esc(home)}</span></div><div><strong>${dp}%</strong><span>Draw</span></div><div><strong>${ap}%</strong><span>${esc(away)}</span></div></div><div class="predict-bar"><i style="width:${hp}%"></i><i style="width:${dp}%"></i><i style="width:${ap}%"></i></div><div class="predict-detail"><span>${esc(home)} recent: ${p.homeAvg.gf.toFixed(1)} GF / ${p.homeAvg.ga.toFixed(1)} GA</span><span>${esc(away)} recent: ${p.awayAvg.gf.toFixed(1)} GF / ${p.awayAvg.ga.toFixed(1)} GA</span></div></div>`;
  }
  function momentumPoints(m){
    const events=(m.events||[]).slice().sort((a,b)=>num(a.minute)-num(b.minute)||num(a.stoppage)-num(b.stoppage));
    const pts=Array.from({length:19},()=>({h:0,a:0}));
    events.forEach(e=>{
      const min=clamp(Math.floor(num(e.minute)/5),0,17),type=eventType(e),isHome=String(e.team_id||'')===String(m.home_team_id)||String(e.team||'')===String(teamDisplayName(m,'home'));
      let v=type==='goal'?5:type==='red'?(isHome?-4:4):type==='yellow'?0.6:type==='substitution'?0.3:type==='assist'?1:0.2;
      if(type==='goal')v=5;
      if(isHome)pts[min].h+=v;else pts[min].a+=v;

    let h=0,a=0;return pts.map((x,i)=>{h=h*.55+x.h;a=a*.55+x.a;return {minute:i*5,home:h,away:a,diff:h-a}});

    if(!has)return `<div class="card mi-panel"><div class="mi-head"><div><div class="eyebrow">Match Momentum</div><h3>Momentum</h3></div></div><div class="mi-muted">Momentum will appear as events and match statistics are recorded.</div></div>`;
    return `<div class="card mi-panel"><div class="mi-head"><div><div class="eyebrow">Match Momentum</div><h3>Match flow</h3><p class="muted">Event-weighted momentum; it is an indicator, not an official statistic.</p></div><div class="mi-legend"><span>● ${esc(teamDisplayName(m,'home'))}</span><span>● ${esc(teamDisplayName(m,'away'))}</span></div></div><div class="momentum-chart">${pts.map(p=>{const h=clamp(Math.abs(p.diff)/max*100,3,100),side=p.diff>=0?'home':'away';return `<div class="momentum-col"><div class="momentum-zero"></div><div class="momentum-fill ${side}" style="height:${h}%"></div><span>${p.minute}'</span></div>`}).join('')}</div><div class="momentum-scale"><span>Home pressure</span><span>Even</span><span>Away pressure</span></div></div>`;
  }
  function featurePlayerScore(p,m){
    const ev=(m.events||[]).filter(e=>String(e.player_id)===String(p.id));let score=0,goals=0,assists=0,y=0,r=0;
    ev.forEach(e=>{const t=eventType(e);if(t==='goal'){goals++;score+=6}else if(t==='assist'){assists++;score+=3}else if(t==='yellow'){y++;score-=1}else if(t==='red'){r++;score-=4}});

  }

    const pg=[...playerMap.values()].sort((a,b)=>b.goals-a.goals)[0],pa=[...playerMap.values()].sort((a,b)=>b.assists-a.assists)[0];

    const r=featureRecords();

  }
  const _baseRenderMatch=renderMatch;

<script>
/* ==================== CupWorks V11 RELIABILITY + DATA LAYER ==================== */
window.CupWorks_V11={version:'11.0'};
(function(){
  const CACHE_KEY='ramadoncup_watch_cache_v11';
  let loadBusy=false, loadSeq=0, cacheWriteTimer=null;
  /* Loading overlay removed: the shell is interactive immediately. */
  function hideBoot(){}
  function bootMessage(){}

  /* Network timeout: prevents Safari/iOS/slow mobile connections from hanging forever. */
  const _fetch=window.fetch.bind(window);
  window.fetch=async function(input,init={}){
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),18000);
    const opts={...init,signal:init.signal||ctl.signal};
    try{return await _fetch(input,opts)}catch(e){if(e?.name==='AbortError')throw new Error('Network request timed out');throw e}finally{clearTimeout(timer)}
  };

  /* Cross-device-safe local cache. Events are cached only for matches already loaded. */
  function cacheDataNow(){try{
    const cachedEvents={};let count=0;
    for(const [id,evs] of eventCache){if(count>=3000)break;const a=Array.isArray(evs)?evs.slice(0,3000-count):[];cachedEvents[id]=a;count+=a.length;}
    localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),matches,news:news.slice(0,100),teams,players,competitions,events:cachedEvents}));
  }catch{}}
  function cacheData(){
    if(cacheWriteTimer)return;
    const run=()=>{cacheWriteTimer=null;cacheDataNow()};
    if('requestIdleCallback' in window)cacheWriteTimer=requestIdleCallback(run,{timeout:1500});
    else cacheWriteTimer=setTimeout(run,300);
  }
  function restoreCache(){try{
    const x=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(!x||Date.now()-Number(x.savedAt)>1000*60*60*24*7)return false;
    if(Array.isArray(x.matches)&&!matches.length)matches=x.matches;if(Array.isArray(x.news)&&!news.length)news=x.news;if(Array.isArray(x.teams)&&!teams.length)teams=x.teams;if(Array.isArray(x.players)&&!players.length)players=x.players;if(Array.isArray(x.competitions)&&!competitions.length)competitions=x.competitions;
    if(x.events&&typeof x.events==='object')for(const [id,evs] of Object.entries(x.events))if(Array.isArray(evs))eventCache.set(String(id),evs);
    for(const m of matches){const ev=eventCache.get(String(m.id));if(ev)m.events=ev.slice();}

  }catch{return false}}

  /* Protect refresh from overlapping requests. */
  const _baseLoad=loadData;

    const seq=++loadSeq;
    if(loadBusy){return false}
    loadBusy=true;
    try{
      if(!matches.length)restoreCache();
      if(matches.length||teams.length) { try{renderAll()}catch{} }
      bootMessage(dbOnline?'Updating CupWorks data…':'Connecting to CupWorks…');
      const result=await _baseLoad();
      if(seq!==loadSeq)return false;
      cacheData();
      hideBoot();
      window.dispatchEvent(new Event('mefco:data-ready'));

      if(!window._mefcoLineupsQueued){
        window._mefcoLineupsQueued=true;
        setTimeout(()=>ensureAutomaticLineups().then(()=>scheduleRender()).catch(e=>console.warn('Automatic lineups:',e)),0);
      }
      return result;
    }catch(e){
      console.error('CupWorks V11 load:',e);
      const had=restoreCache();
      if(had){dbOnline=false;try{renderAll()}catch{};hideBoot();window.dispatchEvent(new Event('mefco:data-ready'));showToast('Showing saved data — database connection is unavailable')}else{bootMessage('CupWorks could not connect to the database.',true);window.dispatchEvent(new Event('mefco:data-ready'));showToast('CupWorks database connection failed')}
      return false;
    }finally{loadBusy=false}
  };

  const _refresh=refreshData;
  refreshData=async function(){if(loadBusy){showToast('A refresh is already running');return}showToast('Refreshing CupWorks data…');const ok=await loadData();if(ok!==false)showToast('Data refreshed');};

  /* Player ratings: transparent event/result formula, not an official football statistic. */
  window.mefcoPlayerRating=function(p,m){
    if(!p||!m)return null;
    const ev=(m.events||[]).filter(e=>String(e.player_id)===String(p.id));
    const started=new Set(readMatchLineups(m).home.concat(readMatchLineups(m).away).map(String)).has(String(p.id));
    let r=6.0;
    ev.forEach(e=>{const t=eventType(e);if(t==='goal')r+=1.5;else if(t==='assist')r+=0.8;else if(t==='yellow')r-=0.4;else if(t==='red')r-=1.8});
    if(started)r+=0.5; else if(ev.length)r+=0.2;
    const [h,a]=scoreOf(m),tid=String(p.team_id),home=String(m.home_team_id)===tid,won=home?h>a:a>h,draw=h===a;

  window.mefcoRatingClass=r=>Number(r)>=8?'rating-high':Number(r)>=6.5?'rating-mid':'rating-low';

  /* Add ratings to the match centre without changing the admin UI. */
  const _renderMatch=renderMatch;
  renderMatch=function(){_renderMatch();const m=matches.find(x=>String(x.id)===String(selectedMatchId)),el=document.getElementById('match-page');if(!m||!el)return;const box=document.getElementById('mefcoV11Ratings');if(box)box.remove();if(!isFinished(m)&&!isLive(m))return;const ids=new Set((m.events||[]).map(e=>String(e.player_id)).filter(Boolean));const line=readMatchLineups(m);line.home.concat(line.away).forEach(id=>ids.add(String(id)));const rows=[...ids].map(id=>playerById(id)).filter(Boolean).map(p=>({p,r:mefcoPlayerRating(p,m)})).filter(x=>x.r!==null).sort((a,b)=>b.r-a.r).slice(0,8);const div=document.createElement('div');div.id='mefcoV11Ratings';div.className='card mi-panel';div.innerHTML=`<div class="mi-head"><div><div class="eyebrow">Player ratings</div><h3>CupWorks match ratings</h3><p class="muted">Calculated from recorded lineups, events and result.</p></div><span class="muted">Indicative</span></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Team</th><th>Rating</th></tr></thead><tbody>${rows.map(x=>`<tr><td><button class="ghost" onclick="openPlayer('${esc(x.p.id)}')">${esc(x.p.short_name||x.p.name)}</button></td><td>${esc(teamName(x.p.team_id,''))}</td><td><span class="rating-chip ${mefcoRatingClass(x.r)}">${x.r.toFixed(1)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="mi-muted">No lineup or player events are recorded.</div>'}`;el.appendChild(div)};

  /* Stronger records + milestones: uses cumulative totals and streaks. */
  window.mefcoRecords=function(){
    const finished=matches.filter(isFinished), stats=collectPlayerStats();
    const topGoals=stats.slice().sort((a,b)=>b.goals-a.goals)[0],topAssists=stats.slice().sort((a,b)=>b.assists-a.assists)[0];
    let biggest=null,highestTeam=null,clean=null;
    finished.forEach(m=>{const [h,a]=scoreOf(m),sum=h+a;const diff=Math.abs(h-a);if(!biggest||sum>biggest.sum||sum===biggest.sum&&diff>biggest.diff)biggest={m,sum,diff};if(!highestTeam||Math.max(h,a)>highestTeam.n)highestTeam={m,n:Math.max(h,a)};if(h===0||a===0){if(!clean||sum>clean.sum)clean={m,sum}}});
    const streaks=[];
    teams.forEach(t=>{const ms=matches.filter(m=>(String(m.home_team_id)===String(t.id)||String(m.away_team_id)===String(t.id))&&isFinished(m)).sort((a,b)=>(matchDate(a)+matchTime(a)).localeCompare(matchDate(b)+matchTime(b)));let w=0,l=0;for(let i=ms.length-1;i>=0;i--){const[h,a]=scoreOf(ms[i]),home=String(ms[i].home_team_id)===String(t.id),gf=home?h:a,ga=home?a:h;if(gf>ga)w++;else break}for(let i=ms.length-1;i>=0;i--){const[h,a]=scoreOf(ms[i]),home=String(ms[i].home_team_id)===String(t.id),gf=home?h:a,ga=home?a:h;if(gf<ga)l++;else break}if(w)streaks.push({t,type:'Winning',n:w});if(l)streaks.push({t,type:'Losing',n:l})});
    const milestoneRows=stats.flatMap(p=>{const n=Number(p.goals||0);return [5,10,25,50,100].filter(x=>n>=x).slice(-1).map(x=>({p,n,x}))}).sort((a,b)=>b.x-a.x||b.n-a.n);
    return {topGoals,topAssists,biggest,highestTeam,clean,streaks:streaks.sort((a,b)=>b.n-a.n).slice(0,8),milestoneRows};
  };
  const _renderStats=renderStatsV3;
  renderStatsV3=function(){_renderStats();const el=document.getElementById('stats');if(!el)return;const old=document.getElementById('v11Records');if(old)old.remove();const r=mefcoRecords(),box=document.createElement('div');box.id='v11Records';box.innerHTML=`<div class="section"><div class="section-head"><div><div class="eyebrow">Records</div><h2>Records & milestones</h2><p>Calculated from completed CupWorks matches.</p></div></div><div class="records-grid">${r.topGoals?`<div class="record-item"><span>Top scorer</span><strong>${esc(r.topGoals.name)}</strong><b>${r.topGoals.goals} goals</b></div>`:''}${r.topAssists?`<div class="record-item"><span>Assist leader</span><strong>${esc(r.topAssists.name)}</strong><b>${r.topAssists.assists} assists</b></div>`:''}${r.biggest?`<div class="record-item"><span>Highest-scoring match</span><strong>${esc(teamDisplayName(r.biggest.m,'home'))} ${scoreOf(r.biggest.m)[0]}–${scoreOf(r.biggest.m)[1]} ${esc(teamDisplayName(r.biggest.m,'away'))}</strong><b>${r.biggest.sum} total goals</b></div>`:''}${r.highestTeam?`<div class="record-item"><span>Most goals by one team</span><strong>${esc(teamDisplayName(r.highestTeam.m,scoreOf(r.highestTeam.m)[0]>=scoreOf(r.highestTeam.m)[1]?'home':'away'))}</strong><b>${r.highestTeam.n} goals</b></div>`:''}</div><div class="milestones"><h3>Current milestones</h3>${r.milestoneRows.length?r.milestoneRows.slice(0,12).map(x=>`<button class="milestone-row" onclick="openPlayer('${esc(x.p.id)}')"><span>${esc(x.p.name||x.p.short_name)} reached ${x.x} goals</span><b>${x.n} total</b></button>`).join(''):'<div class="mi-muted">No 5/10/25/50/100-goal milestones yet.</div>'}</div><div class="milestones"><h3>Current streaks</h3>${r.streaks.length?r.streaks.map(x=>`<div class="milestone-row"><span>${esc(x.t.name)} ${x.type.toLowerCase()} streak</span><b>${x.n}</b></div>`).join(''):'<div class="mi-muted">No active winning or losing streaks.</div>'}</div></div>`;el.appendChild(box)};

  /* Database health: score/event/lineup integrity checks. */
  window.runV11Health=async function(){
    const card=document.createElement('div');card.className='card health-card';card.id='v11Health';card.innerHTML='<div class="section-head"><div><div class="eyebrow">Database health</div><h3>Running integrity checks…</h3></div></div>';document.getElementById('home')?.appendChild(card);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    const issues=[];
    for(const m of matches){const [h,a]=scoreOf(m),goals=(m.events||[]).filter(e=>eventType(e)==='goal').length;if(isFinished(m)&&h+a!==goals)issues.push(`${teamDisplayName(m,'home')} ${h}–${a} ${teamDisplayName(m,'away')}: score has ${h+a} goals but ${goals} goal events.`);for(const e of(m.events||[])){if(!['goal','assist','yellow','red','substitution','var'].includes(eventType(e)))issues.push(`${m.id}: unknown event type ${eventType(e)}`);if(e.player_id&&!playerById(e.player_id))issues.push(`${m.id}: event references missing player ${e.player_id}`);if(e.team_id&&!teamById(e.team_id))issues.push(`${m.id}: event references missing team ${e.team_id}`)}const lu=readMatchLineups(m);for(const id of [...lu.home,...lu.away])if(!playerById(id))issues.push(`${m.id}: lineup references missing player ${id}`)}
    const endpoints=[['Matches',MATCHES_URL],['Events',EVENTS_URL],['Teams',TEAMS_URL],['Players',PLAYERS_URL],['Competitions',COMPETITIONS_URL],['News',NEWS_URL]];const reach=[];for(const [name,url] of endpoints){try{await supabaseFetch(url+'?select=id&limit=1');reach.push([name,true])}catch{reach.push([name,false])}}

  };

  /* Replace the old health button target with the stronger checks. */

  const _jump=jumpScoreDate;jumpScoreDate=function(v){if(/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))){scoreDate=String(v);renderScores();}};

ch{min-height:450px}}
